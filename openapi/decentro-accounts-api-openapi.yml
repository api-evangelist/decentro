openapi: 3.2.0
info:
  title: Decentro Ledger Accounts API
  description: Decentro Ledger API provides double-entry accounting primitives - journals, ledger accounts, and transactions - to record financial activity across virtual accounts and external counterparties.
  version: '1.0'
servers:
- url: https://in.decentro.tech
  description: India production
security:
- apiKey: []
tags:
- name: Accounts
paths:
  /v2/ledger/account:
    post:
      summary: Create a ledger account
      operationId: createLedgerAccount
      tags:
      - Accounts
      responses:
        '200':
          description: Ledger account created.
  /v2/ledger/account/{id}:
    get:
      summary: Get a ledger account
      operationId: getLedgerAccount
      tags:
      - Accounts
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ledger account details.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: client_secret

openapi: 3.1.0
info:
  title: Decentro KYC & Onboarding Accounts Mandates API
  description: Decentro's KYC & Onboarding API provides identity verification, customer onboarding workflows, and document/face forensics for Indian financial services.
  version: '1.0'
  contact:
    name: Decentro
    url: https://decentro.tech/
servers:
- url: https://in.decentro.tech
  description: India production
- url: https://staging.decentro.tech
  description: Staging
security:
- apiKey: []
tags:
- name: Mandates
paths:
  /v2/payments/enach/register:
    post:
      summary: Register an ENACH mandate
      operationId: registerEnachMandate
      tags:
      - Mandates
      responses:
        '200':
          description: Mandate registration result.
  /v2/payments/upi-autopay/mandate:
    post:
      summary: Register a UPI Autopay mandate
      operationId: registerUpiAutopayMandate
      tags:
      - Mandates
      responses:
        '200':
          description: Autopay mandate registration.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: client_secret

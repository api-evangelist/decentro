        '400':
          description: '400'
          content:
            application/json:
              examples:
                'Failure: Multiple identifiers not allowed in Input':
                  value: "{\n    \"decentro_txn_id\": \"1305D1ABF79F4F3FAAB48E2E435D0B3E\",\n    \"api_status\": \"FAILURE\",\n    \"message\": \"Multiple identifiers were included in the request. Please provide only one identifier to proceed.\",\n    \"response_key\": \"error_multiple_identifiers_not_allowed\"\n}"
              schema:
                type: object
                properties:
                  decentro_txn_id:
                    type: string
                    example: 1305D1ABF79F4F3FAAB48E2E435D0B3E
                  api_status:
                    type: string
                    example: FAILURE
                  message:
                    type: string
                    example: Multiple identifiers were included in the request. Please provide only one identifier to proceed.
                  response_key:
                    type: string
                    example: error_multiple_identifiers_not_allowed
      deprecated: false
      tags:
      - Banking
  /v3/banking/balance:
    get:
      summary: Get Balance
      description: This API lets the platform fetch the current balance of a virtual account.
      operationId: payments_api-virtualaccounts3-balance
      parameters:
      - name: client_id
        in: header
        description: Decentro assigned client_id during onboarding.
        required: true
        schema:
          type: string
          default: merchant_prod
      - name: consumer_urn
        in: query
        description: A unique identifier assigned to client's by Decentro during On boarding.
        schema:
          type: string
      - name: account_number
        in: query
        description: The virtual account number for which the balance needs to be fetched.
        required: true
        schema:
          type: string
      - name: client_secret
        in: header
        description: Decentro assigned client_secret during onboarding.
        required: true
        schema:
          type: string
          default: merchant_secret
      - name: custom_va_number
        in: query
        description: 'The suffix part of the VA that uniquely identifies each VA. It can be from 6 -10 digit. Eg: va_suffix will be 000001 for virtual account number 46525000001'
        schema:
          type: string
      - name: customer_va_identifier
        in: query
        description: Unique customer identifier that is mapped against the virtual account.
        schema:
          type: string
      - name: fetch_child_balance
        in: query
        description: Pass this flag as true/false depending on whether you want to fetch the balance of a child consumer.
        schema:
          type: boolean
      - name: provider_code
        in: query
        description: 'Provider code of the bank with which account is created. For example, provider_code: YESB'
        schema:
          type: string
      - name: fetch_compliance_balance
        in: query
        description: Pass the flag as true/false depending on whether you want to fetch the compliance balance of the consumer
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                'Success: Virtual account balance':
                  value: "{\n    \"decentro_txn_id\": \"A49B664CC3F44CB2A1A0A6FC513BFAC1\",\n    \"api_status\": \"SUCCESS\",\n    \"message\": \"Successfully fetched the balance.\",\n    \"data\": {\n        \"account_balance\": {\n            \"account_number\": \"4625250067981922\",\n            \"account_type\": \"VIRTUAL\",\n            \"current_balance\": 0.0,\n            \"minimum_balance\": 0.0\n        }\n    }\n}"
                'Success: consumer URN balance (cumulative)':
                  value: "{\n    \"decentro_txn_id\": \"D1B356E8E8F04C3C8309DF35FA09CB98\",\n    \"api_status\": \"SUCCESS\",\n    \"message\": \"Successfully fetched the balance.\",\n    \"data\": {\n        \"consumer_cumulative_balance\": 179.5981\n    }\n}"
                'Success: customer VA identifier balance (cumulative)':

  /v3/banking/verify_pay:
    post:
      summary: VerifyPay (V3)
      description: Validate a UPI VPA via a penny drop
      operationId: verifypay-V3
      parameters:
      - name: client_id
        in: header
        required: true
        schema:
          type: string
      - name: client_secret
        in: header
        required: true
        schema:
          type: string
      - name: x_on_behalf_of
        in: header
        description: Optional header that allows parent merchant to consume the API on behalf of sub-merchant.
        schema:
          type: string
      - name: content-type
        in: header
        description: Indicates the type of the resource being sent in the body of an HTTP request
        required: true
        schema:
          type: string
          default: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - consumer_urn
              - is_consent_granted
              - reference_id
              - upi_vpa
              properties:
                consumer_urn:
                  type: string
                  description: A unique identifier assigned to client's by Decentro during On-boarding.
                is_consent_granted:
                  type: boolean
                  description: 'This flag will be used to capture the end-customers consent to proceed with the verification. Possible Values: true, false.'
                  default: true
                reference_id:
                  type: string
                  description: A unique ID assigned by you for this transaction
                upi_vpa:
                  type: string
                  description: UPI-ID (Virtual Payment Address) to be validated
                  default: test@upi
                purpose_message:
                  type: string
                  description: 'This parameter allows the platform to share a custom message that will be propagated to the end-customer. Minimum Length: 4 characters; Maximum Length: 50 characters'
                fetch_branch_details:
                  type: boolean
                  description: 'This flag can be used to fetch the details of the bank branch associated with the bank account. Possible Values: true, false.'
                  default: false
                perform_name_match:
                  type: boolean
                  description: 'This flag can be used to perform a name match between the provided value and the account holders name received from their bank during the validation. Possible Values: true, false.'
                  default: false
                customer_name:
                  type: string
                  description: The name of the end-customer as per the merchant records. Mandatory if perform_name_match is true.
            examples:
              'Success: Valid UPI VPA':
                value:
                  reference_id: 88bf527d-73dc-465d-914f-8009ddca8bf1
                  is_consent_granted: true
                  upi_vpa: 8972241839@upi
                  consumer_urn: 5269D0A80FF741F5B7A6E00F9D90F7E1
                  purpose_message: Intenral Testing
                  customer_name: First Last
                  fetch_branch_details: true
                  perform_name_match: true
              'Success: Invalid UPI VPA':
                value:
                  reference_id: d477871e-f66a-4c1e-8c7f-8f0a72614f4c
                  is_consent_granted: true
                  upi_vpa: 8949342808@upi
                  consumer_urn: 5269D0A80FF741F5B7A6E00F9D90F7E1
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Success - Masked Account Number:
                  value: "{\n    \"decentro_txn_id\": \"1FE0327430174A4E8B5780C6B779FA94\",\n    \"api_status\": \"SUCCESS\",\n    \"message\": \"Account details retrieved successfully\",\n    \"data\": {\n        \"upi_vpa\": \"8972241839@upi\",\n        \"name_as_per_bank\": \"KAPIL DEV\",\n        \"account_number\": \"XXXXXXX1983\",\n        \"ifsc\": \"HDFC0000001\",\n        \"account_type\": \"SAVINGS\",\n        \"payout_status\": \"SUCCESS\",\n        \"payout_amount\": \"1.00\",\n        \"bank_reference_number\": \"0a3487327d724d1eb429393fb9c90c4d\"\n    },\n    \"response_key\": \"success_account_details_retrieved\"\n}"

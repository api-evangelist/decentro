  /v3/banking/settlement_account_setup:
    post:
      summary: Manage VA Settlement
      description: This API allows the platform to manage the settlement account to where the virtual account settlements are performed.
      operationId: payments_api-settlementsv3-manage-settlement
      parameters:
      - name: client_id
        in: header
        required: true
        schema:
          type: string
      - name: client_secret
        in: header
        required: true
        schema:
          type: string
      - name: x_on_behalf_of
        in: header
        description: Optional header that allows parent merchant to consume the API on behalf of sub-merchant.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reference_id
              - action
              - virtual_account_number
              properties:
                reference_id:
                  type: string
                  description: A unique ID assigned by clients for every API request.
                action:
                  type: string
                  description: 'The action that the platform wants to take on settlement account. Possible values: ACTIVATE/DEACTIVATE.'
                virtual_account_number:
                  type: string
                  description: The virtual account number against which the settlement account is being added.
                settlement_account_number:
                  type: string
                  description: The bank account number to which the settlement needs to be undertaken. Mandatory if transfer_type = NEFT/RTGS/IMPS
                settlement_account_ifsc:
                  type: string
                  description: The bank account IFSC to which the settlement needs to be undertaken. Mandatory if transfer_type = NEFT/RTGS/IMPS
                settlement_account_name:
                  type: string
                  description: The name of the settlement account holder
                settlement_account_urn:
                  type: string
                  description: Unique URN received while adding a settlement account against a VA. Mandatory when action is 'DEACTIVATE'.
            examples:
              'Success: Add settlement account':
                value:
                  reference_id: 2998c252-e748-45a3-91c7-75a721996346
                  action: ACTIVATE
                  virtual_account_number: '4625257719628478'
                  settlement_account_number: Validaccount22
                  settlement_account_ifsc: ICIC0001302
                  settlement_account_name: Robot212454
              'Success: Disable settlement account':
                value:
                  reference_id: 2998c252-e748-45a3-91c7-75a721996346
                  action: DEACTIVATE
                  virtual_account_number: '4625257719628478'
                  settlement_account_urn: 1084AADE38054137B9F01594754020D6
              'Failure: Empty action field':
                value:
                  reference_id: 0000-0000-0000
                  virtual_account_number: '4625250092951178'
                  settlement_account_number: '89433454678320'
                  settlement_account_ifsc: ICIC0001302
                  settlement_account_name: Jhon doe
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:

    post:
      summary: Add Split Settlement Rule API
      description: ''
      operationId: add-split-settlement-rule-api
      parameters:
      - name: client_id
        in: header
        description: Decentro assigned client_id during on boarding.
        required: true
        schema:
          type: string
      - name: client_secret
        in: header
        description: Decentro assigned client_secret during on boarding.
        required: true
        schema:
          type: string
      - name: x_on_behalf_off
        in: header
        description: Optional header that allows parent merchant to consume the API on behalf of sub-merchant.The child consumer URN value must be passed here.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reference_id
              properties:
                reference_id:
                  type: string
                  description: A unique ID assigned by clients for every API request.
                  default: 0000-0000-0001
                consumer_urn:
                  type: string
                  description: A unique identifier assigned to client's by Decentro during On boarding. (Mandatory if "virtual_account_number" is not passed)
                  default: 84E9A23xxxxxxxxxxxxxxx9E5FE16A
                virtual_account_number:
                  type: string
                  description: The virtual account number against which the settlement account is being added. (Mandatory if "consumer_urn" is not passed.)
                  default: '4625257719628478'
                split_settlement_rule:
                  type: array
                  items:
                    properties:
                      settlement_account_urn:
                        type: string
                        description: The URN generated by Decentro for a settlement account number added.
                        default: 1084AADE38054137B9F01594754020D6
                      percentage:
                        type: integer
                        description: The percentage assigned for the settlement account. percentage or amount must be present here. Maximum of 2 decibels are allowed.
                        default: null
                        format: int32
                      amount:
                        type: integer
                        description: The amount assigned for the settlement account. percentage or amount must be present. Maximum of 2 decibels are allowed.
                        default: 10
                        format: int32
                      commission_deduction:
                        type: boolean
                        description: A flag to mark the commission deduction's settlement account when the settlement process takes place. Only 1 account can have the flag as "true".
                        default: true
                    required:
                    - settlement_account_urn
                    type: object
            examples:
              Add Split rule against a consumer URN:
                value:
                  reference_id: 0000-0000-0001
                  consumer_urn: B15CDC6B444B4B7781D5A74F1E96A239
                  split_settlement_rule:
                  - settlement_account_urn: B2071BE05A8442FBACDC9C7A7EAB12A4
                    amount: 10
                  - settlement_account_urn: 21A97487CB3643F9B5A21935394C36E0
                    percentage: 100
                    commission_deduction: 'true'
              Add split rule against a virtual account number:
                value:
                  reference_id: 0000-0000-0001
                  virtual_account_number: '4625250012121213'
                  split_settlement_rule:
                  - settlement_account_urn: B2071BE05A8442FBACDC9C7A7EAB12A4
                    amount: 10
                  - settlement_account_urn: 21A97487CB3643F9B5A21935394C36E0
                    percentage: 100
                    commission_deduction: 'true'
              Add split rule with split by percentage only:
                value:
                  reference_id: 0000-0000-0001
                  consumer_urn: B15CDC6B444B4B7781D5A74F1E96A239
                  split_settlement_rule:
                  - settlement_account_urn: B2071BE05A8442FBACDC9C7A7EAB12A4
                    percentage: 90

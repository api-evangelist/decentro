openapi: 3.2.0
info:
  title: Decfin Staging Banking API
  version: '1.0'
servers:
- url: https://staging.api.decentro.tech
security:
- {}
tags:
- name: Banking
paths:
  /v3/banking/account/virtual:
    post:
      summary: Create Virtual Account
      description: This API is an updated version of creating a virtual account on Decentro's v3 stack.
      operationId: payments_api-virtualaccounts3-create-va
      parameters:
      - name: client_id
        in: header
        description: Decentro assigned client_id during onboarding.
        required: true
        schema:
          type: string
      - name: client_secret
        in: header
        description: Decentro assigned client_secret during on boarding.
        required: true
        schema:
          type: string
      - name: x_on_behalf_of
        in: header
        description: Optional header that allows parent merchant to consume the API on behalf of sub-merchant.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reference_id
              - consumer_urn
              - customer_va_identifier
              properties:
                reference_id:
                  type: string
                  description: A unique ID assigned by clients for every API request.
                consumer_urn:
                  type: string
                  description: A unique identifier assigned to each merchant by Decentro during Onboarding
                name:
                  type: string
                  description: Virtual account holder name to be put against the account.
                customer_va_identifier:
                  type: string
                  description: Unique customer identifier to be saved against the virtual account.
                custom_va_number:
                  type: string
                  description: custom virtual account suffix as requested by the platform. If not passed, Decentro creates a VA number at its end.
                block_va_auto_settlement:
                  type: string
                  description: This flag, if set of true, will not settle the balances held in this virtual account to the settlement account. Default - False
                  default: 'False'
            examples:
              'Success: Pass Custom Virtual Account Number':
                value:
                  reference_id: 0000-0000-0001
                  consumer_urn: B15CDC6B444B4B7781D5A74F1E96A239
                  name: jhon
                  customer_va_identifier: abc12345
                  custom_va_number: '000054321'
                  block_va_auto_settlement: false
              'Success: Decentro creates Virtual Account Number':
                value:
                  reference_id: 0000-0000-0002
                  consumer_urn: B15CDC6B444B4B7781D5A74F1E96A239
                  name: test
                  customer_va_identifier: xyz12345
                  block_va_auto_settlement: false
              'Failure: Virtual Account not created':
                value:
                  reference_id: 0000-0000-0003
                  consumer_urn: B15CDC6B444B4B7781D5A74F1E96A239
                  name: test
                  customer_va_identifier: xyurt5649
                  custom_va_number: '000054321'
                  block_va_auto_settlement: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                'Success: Pass Custom Virtual Account Number':
                  value: "{\n    \"decentro_txn_id\": \"E3335083304D418FA8E340BE63CB29B5\",\n    \"api_status\": \"SUCCESS\",\n    \"message\": \"Virtual accounts created successfully.\",\n    \"data\": {\n        \"account_details\": [\n            {\n                \"custom_va_number\": \"000054321\",\n                \"virtual_account_number\": \"4625250000054321\",\n                \"virtual_account_ifsc\": \"YESB0CMSNOC\",\n                \"virtual_account_status\": \"ACTIVE\",\n                \"transfer_type_enabled\": [\n                    \"IMPS\",\n                    \"NEFT\",\n                    \"RTGS\"\n                ]\n            }\n        ]\n    },\n    \"response_key\": \"success_virtual_account_created\"\n}"
                'Success: Decentro creates Virtual Account Number':
                  value: "{\n    \"decentro_txn_id\": \"C4E4657C305841EBB576A4575F0BB67B\",\n    \"api_status\": \"SUCCESS\",\n    \"message\": \"Virtual accounts created successfully.\",\n    \"data\": {\n        \"account_details\": [\n            {\n                \"custom_va_number\": \"1951911673\",\n                \"virtual_account_number\": \"4625251951911673\",\n                \"virtual_account_ifsc\": \"YESB0CMSNOC\",\n                \"virtual_account_status\": \"ACTIVE\",\n                \"transfer_type_enabled\": [\n                    \"IMPS\",\n                    \"NEFT\",\n                    \"RTGS\"\n                ]\n            }\n        ]\n    },\n    \"response_key\": \"success_virtual_account_created\"\n}"
              schema:
                oneOf:
                - title: 'Success: Pass Custom Virtual Account Number'
                  type: object
                  properties:
                    decentro_txn_id:
                      type: string
                      example: E3335083304D418FA8E340BE63CB29B5
                    api_status:
                      type: string
                      example: SUCCESS
                    message:
                      type: string
                      example: Virtual accounts created successfully.
                    data:
                      type: object
                      properties:
                        account_details:
                          type: array
                          items:
                            type: object
                            properties:
                              custom_va_number:
                                type: string
                                example: '000054321'
                              virtual_account_number:
                                type: string
                                example: '4625250000054321'
                              virtual_account_ifsc:
                                type: string
                                example: YESB0CMSNOC
                              virtual_account_status:
                                type: string
                                example: ACTIVE
                              transfer_type_enabled:
                                type: array
                                items:
                                  type: string
                                  example: IMPS
                    response_key:
                      type: string
                      example: success_virtual_account_created
                - title: 'Success: Decentro creates Virtual Account Number'
                  type: object
                  properties:
                    decentro_txn_id:
                      type: string
                      example: C4E4657C305841EBB576A4575F0BB67B
                    api_status:
                      type: string
                      example: SUCCESS
                    message:
                      type: string
                      example: Virtual accounts created successfully.
                    data:
                      type: object
                      properties:
                        account_details:
                          type: array
                          items:
                            type: object
                            properties:
                              custom_va_number:
                                type: string
                                example: '1951911673'
                              virtual_account_number:
                                type: string
                                example: '4625251951911673'
                              virtual_account_ifsc:
                                type: string
                                example: YESB0CMSNOC
                              virtual_account_status:
                                type: string
                                example: ACTIVE
                              transfer_type_enabled:
                                type: array
                                items:
                                  type: string
                                  example: IMPS
                    response_key:
                      type: string
                      example: success_virtual_account_created
        '400':
          description: '400'
          content:
            application/json:
              examples:
                'Failure: Virtual Account not created':
                  value: "{\n    \"decentro_txn_id\": \"A9AA820450534889BEC47611108C34BC\",\n    \"api_status\": \"FAILURE\",\n    \"message\": \"Provided custom VA number already exists. Please provide a unique value.\",\n    \"response_key\": \"error_duplicate_custom_va_number\"\n}"
              schema:
                type: object
                properties:
                  decentro_txn_id:
                    type: string
                    example: A9AA820450534889BEC47611108C34BC
                  api_status:
                    type: string
                    example: FAILURE
                  message:
                    type: string
                    example: Provided custom VA number already exists. Please provide a unique value.
                  response_key:
                    type: string
                    example: error_duplicate_custom_va_number
      deprecated: false
      tags:
      - Banking
    get:
      summary: Get Virtual Account Detail
      description: This API allows clients to fetch the details of their virtual accounts with Decentro
      operationId: get-virtual-account-details
      parameters:
      - name: client_id
        in: header
        description: Decentro assigned client_id during onboarding.
        schema:
          type: string
      - name: client_secret
        in: header
        description: Decentro assigned client_secret during onboarding.
        schema:
          type: string
      - name: x_on_behalf_of
        in: header
        description: Optional header that allows parent merchant to consume the API on behalf of sub-merchant.
        schema:
          type: string
      - name: consumer_urn
        in: query
        description: A unique identifier assigned to each merchant by Decentro during Onboarding
        schema:
          type: string
      - name: page
        in: query
        description: The page number for viewing the virtual account details. Should be a valid positive integer.
        required: true
        schema:
          type: string
      - name: virtual_account_number
        in: query
        description: Virtual account number as requested by the platform.
        schema:
          type: string
      - name: custom_va_number
        in: query
        description: 'The suffix part of the VA that uniquely identifies each VA. It can be from 6 -10 digit. Eg: va_suffix will be 000001 for virtual account number 46525000001'
        schema:
          type: string
      - name: customer_va_identifier
        in: query
        description: Unique customer identifier that is mapped against the virtual account.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                'Success: Virtual account details':
                  value: "{\n    \"decentro_txn_id\": \"2110F0CD6FCC4722968688ABA787183C\",\n    \"api_status\": \"SUCCESS\",\n    \"message\": \"Virtual accounts retrieved successfully.\",\n    \"data\": {\n        \"virtual_accounts\": [\n            {\n                \"virtual_account_number\": \"4625250000004321\",\n                \"custom_va_number\": \"00004321\",\n                \"block_va_auto_settlement\": false,\n                \"name\": \"test\",\n                \"customer_va_identifier\": \"b3a26908-xxxxxxxx-ba65-6bc423c14772\",\n                \"status\": \"ACTIVE\",\n                \"va_created_on\": \"2025-01-10 12:31:20\",\n                \"bank_provider\": \"YESB\",\n                \"current_balance\": 15000.0,\n                \"settlement_account_details\": [\n                    {\n                        \"settlement_account_urn\": \"E153669400D64D1AA28E97D25E6B9CC5\",\n                        \"account_number\": \"007881300004451\",\n                        \"account_ifsc\": \"YESB0000078\"\n                    }\n                ],\n                \"whitelisted_account_details\": [\n                    {\n                        \"account_number\": \"002281300011235\",\n                        \"account_ifsc\": \"YESB0000022\",\n                        \"remitter_relationship\": \"test demo 1\"\n                    },\n                    {\n                        \"account_number\": \"00361001000589\",\n                        \"account_ifsc\": \"MSNU0000036\",\n                        \"remitter_relationship\": \"test dmeo 2\"\n                    },\n                    {\n                        \"account_number\": \"00361001000589\",\n                        \"account_ifsc\": \"MSNU0000036\",\n                        \"remitter_relationship\": \"Vraj demo 3\"\n                    }\n                ]\n            }\n        ],\n        \"page_count\": 1,\n        \"total_page_count\": 1,\n        \"total_count\": 1\n    }\n}"
                'Success: Virtual account details on multiple page':
                  value: "{\n    \"decentro_txn_id\": \"5089F6E0F34342E397A4D116440A5EE4\",\n    \"api_status\": \"SUCCESS\",\n    \"message\": \"Virtual accounts retrieved successfully.\",\n    \"data\": {\n        \"virtual_accounts\": [\n            {\n                \"virtual_account_number\": \"4625250067981922\",\n                \"custom_va_number\": \"67981922\",\n                \"block_va_auto_settlement\": true,\n                \"name\": \"name Test\",\n                \"customer_va_identifier\": \"26237\",\n                \"status\": \"ACTIVE\",\n                \"va_created_on\": \"2025-01-10 12:31:20\",\n                \"bank_provider\": \"YESB\",\n                \"current_balance\": 15000.0,\n                \"settlement_account_details\": [\n                    {\n                        \"settlement_account_urn\": \"E153669400D64D1AA28E97D25E6B9CC5\",\n                        \"account_number\": \"007881300004451\",\n                        \"account_ifsc\": \"YESB0000078\"\n                    }\n                ],\n                \"whitelisted_account_details\": [\n                    {\n                        \"account_number\": \"002281300011235\",\n                        \"account_ifsc\": \"YESB0000022\",\n                        \"remitter_relationship\": \"test ecollect 2\"\n                    },\n                    {\n                        \"account_number\": \"00361001000589\",\n                        \"account_ifsc\": \"MSNU0000036\",\n                        \"remitter_relationship\": \"test ecollect 1\"\n                    },\n                    {\n                        \"account_number\": \"00361001000589\",\n                        \"account_ifsc\": \"MSNU0000036\",\n                        \"remitter_relationship\": \"Ecollect\"\n                    }\n                ]\n            },\n            {\n                \"virtual_account_number\": \"4625250086391789\",\n                \"custom_va_number\": \"86391789\",\n                \"block_va_auto_settlement\": true,\n                \"name\": \"Robot Test\",\n                \"customer_va_identifier\": \"91991\",\n                \"status\": \"ACTIVE\",\n                \"va_created_on\": \"2025-01-10 12:31:20\",\n                \"bank_provider\": \"YESB\",\n                \"current_balance\": 15000.0,\n                \"settlement_account_details\": [\n                    {\n                        \"settlement_account_urn\": \"E153669400D64D1AA28E97D25E6B9CC5\",\n                        \"account_number\": \"007881300004451\",\n                        \"account_ifsc\": \"YESB0000078\"\n                    }\n                ],\n                \"whitelisted_account_details\": [\n                    {\n                        \"account_number\": \"002281300011235\",\n                        \"account_ifsc\": \"YESB0000022\",\n                        \"remitter_relationship\": \"test ecollect 1\"\n                    },\n                    {\n                        \"account_number\": \"00361001000589\",\n                        \"account_ifsc\": \"MSNU0000036\",\n                        \"remitter_relationship\": \"test ecollect 2\"\n                    },\n                    {\n                        \"account_number\": \"00361001000589\",\n                        \"account_ifsc\": \"MSNU0000036\",\n                        \"remitter_relationship\": \"Ecollect\"\n                    }\n                ]\n            },\n            {\n                \"virtual_account_number\": \"4625250043839683\",\n                \"custom_va_number\": \"43839683\",\n                \"block_va_auto_settlement\": true,\n                \"name\": \"Test\",\n                \"customer_va_identifier\": \"13161\",\n                \"status\": \"ACTIVE\",\n                \"va_created_on\": \"2025-01-10 12:31:20\",\n                \"bank_provider\": \"YESB\",\n                \"current_balance\": 15000.0,\n                \"settlement_account_details\": [\n                    {\n                        \"settlement_account_urn\": \"E153669400D64D1AA28E97D25E6B9CC5\",\n                        \"account_number\": \"007881300004451\",\n                        \"account_ifsc\": \"YESB0000078\"\n                    }\n                ],\n                \"whitelisted_account_details\": [\n                    {\n                        \"account_number\": \"002281300011235\",\n                        \"account_ifsc\": \"YESB0000022\",\n                        \"remitter_relationship\": \"test ecollect 1\"\n                    },\n                    {\n                        \"account_number\": \"00361001000589\",\n                        \"account_ifsc\": \"MSNU0000036\",\n                        \"remitter_relationship\": \"test ecollect 2\"\n                    },\n                    {\n                        \"account_number\": \"00361001000589\",\n                        \"account_ifsc\": \"MSNU0000036\",\n                        \"remitter_relationship\": \"Ecollect\"\n                    }\n                ]\n            },\n            {\n                \"virtual_account_number\": \"4625250000000427\",\n                \"custom_va_number\": \"000427\",\n                \"block_va_auto_settlement\": true,\n                \"name\": \"Test\",\n                \"customer_va_identifier\": \"313\",\n                \"status\": \"ACTIVE\",\n                \"va_created_on\": \"2025-01-10 12:31:20\",\n                \"bank_provider\": \"YESB\",\n                \"current_balance\": 15000.0,\n                \"settlement_account_details\": [\n                    {\n                        \"settlement_account_urn\": \"E153669400D64D1AA28E97D25E6B9CC5\",\n                        \"account_number\": \"007881300004451\",\n                        \"account_ifsc\": \"YESB0000078\"\n                    }\n                ],\n                \"whitelisted_account_details\": [\n                    {\n                        \"account_number\": \"002281300011235\",\n                        \"account_ifsc\": \"YESB0000022\",\n                        \"remitter_relationship\": \"test ecollect 1\"\n                    },\n                    {\n                        \"account_number\": \"00361001000589\",\n                        \"account_ifsc\": \"MSNU0000036\",\n                        \"remitter_relationship\": \"test ecollect 2\"\n                    },\n                    {\n                        \"account_number\": \"00361001000589\",\n                        \"account_ifsc\": \"MSNU0000036\",\n                        \"remitter_relationship\": \"Ecollect\"\n                    }\n                ]\n            },\n            {\n                \"virtual_account_number\": \"4625254845778981\",\n                \"custom_va_number\": \"4845778981\",\n                \"block_va_auto_settlement\": false,\n                \"name\": \"vraj\",\n                \"customer_va_identifier\": \"abc54rpiu\",\n                \"status\": \"ACTIVE\",\n                \"va_created_on\": \"2025-01-10 12:31:20\",\n                \"bank_provider\": \"YESB\",\n                \"current_balance\": 15000.0,\n                \"settlement_account_details\": [\n                    {\n                        \"settlement_account_urn\": \"E153669400D64D1AA28E97D25E6B9CC5\",\n                        \"account_number\": \"007881300004451\",\n                        \"account_ifsc\": \"YESB0000078\"\n                    }\n                ],\n                \"whitelisted_account_details\": [\n                    {\n                        \"account_number\": \"002281300011235\",\n                        \"account_ifsc\": \"YESB0000022\",\n                        \"remitter_relationship\": \"test ecollect 1\"\n                    },\n                    {\n                        \"account_number\": \"00361001000589\",\n                        \"account_ifsc\": \"MSNU0000036\",\n                        \"remitter_relationship\": \"test ecollect 2\"\n                    },\n                    {\n                        \"account_number\": \"00361001000589\",\n                        \"account_ifsc\": \"MSNU0000036\",\n                        \"remitter_relationship\": \"Ecollect\"\n                    }\n                ]\n            }\n        ],\n        \"page_count\": 1,\n        \"total_page_count\": 11,\n        \"total_count\": 155\n    }\n}"
              schema:
                oneOf:
                - title: 'Success: Virtual account details'
                  type: object
                  properties:
                    decentro_txn_id:
                      type: string
                      example: 2110F0CD6FCC4722968688ABA787183C
                    api_status:
                      type: string
                      example: SUCCESS
                    message:
                      type: string
                      example: Virtual accounts retrieved successfully.
                    data:
                      type: object
                      properties:
                        virtual_accounts:
                          type: array
                          items:
                            type: object
                            properties:
                              virtual_account_number:
                                type: string
                                example: '4625250000004321'
                              custom_va_number:
                                type: string
                                example: '00004321'
                              block_va_auto_settlement:
                                type: boolean
                                example: false
                                default: true
                              name:
                                type: string
                                example: test
                              customer_va_identifier:
                                type: string
                                example: b3a26908-xxxxxxxx-ba65-6bc423c14772
                              status:
                                type: string
                                example: ACTIVE
                              va_created_on:
                                type: string
                                example: '2025-01-10 12:31:20'
                              bank_provider:
                                type: string
                                example: YESB
                              current_balance:

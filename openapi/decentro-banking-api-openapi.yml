                      properties:
                        settlement_account_details:
                          type: array
                          items:
                            type: object
                            properties:
                              settlement_account_urn:
                                type: string
                                example: 1084AADE38054137B9F01594754020D6
                              settlement_account_number:
                                type: string
                                example: '89433454678320'
                              settlement_account_ifsc:
                                type: string
                                example: ICIC0001302
                              settlement_account_name:
                                type: string
                                example: mock test
                              virtual_account_number:
                                type: string
                                example: '4625250092951178'
                    response_key:
                      type: string
                      example: success_settlement_account_added
                - title: 'Success: Disable settlement account'
                  type: object
                  properties:
                    decentro_txn_id:
                      type: string
                      example: 63F2F1B28BEA44E3B275C825D4DA8A79
                    api_status:
                      type: string
                      example: SUCCESS
                    message:
                      type: string

  /v3/banking/manage_default_settlement_configuration:
    post:
      summary: Set Default Split Settlement Rule Configuration
      description: ''
      operationId: set-default-split-settlement-rule-configuration
      parameters:
      - name: client_id
        in: header
        description: Decentro assigned client_id during on boarding.
        required: true
        schema:
          type: string
          default: client_id
      - name: client_secret
        in: header
        description: Decentro assigned client_secret during on boarding.
        required: true
        schema:
          type: string
          default: client_secret
      - name: x_on_behalf_off
        in: header
        description: Optional header that allows parent merchant to consume the API on behalf of sub-merchant.The child consumer URN value must be passed here.
        schema:
          type: string
          default: C51740BA757C44B3A42D569D59118148
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reference_id
              - default_split_settlement_rule_urn
              properties:
                reference_id:
                  type: string
                  description: A unique ID assigned by clients for every API request.
                  default: 0000-0000-0001
                settlement_type:
                  type: string
                  description: The payment channel against which the settlement must be configured. "UPI_COLLECTION","E_COLLECT","NACH","UPI_AUTOPAY"
                  default: E_COLLECT
                virtual_account_number:
                  type: string
                  description: The virtual account number to be passed here. Mandatory only if the settlement type is "E_COLLECT".
                  default: '4625257719628478'
                consumer_urn:
                  type: string
                  description: The consumer URN to be passed here. Mandatory only if settlement type is not "E_COLLECT".
                  default: 84E9A23xxxxxxxxxxxxxxx9E5FE16A
                default_split_settlement_rule_urn:
                  type: string
                  description: A URN generated to map the rules of the split against it. The URN passed here will be the default split rule.
                  default: 426BF8958FC64708A50258DC4C9DF5F4
            examples:
              UPI collection:
                value:
                  reference_id: 0389274e-d15c-416e-88de-ecb30f599aab
                  settlement_type: UPI_COLLECTION
                  consumer_urn: 820D7E712A594AF6A162241081AA1532
                  default_split_settlement_rule_urn: 43CB10225A0448119CD39BE8487BC4A0
              Ecollect:
                value:
                  reference_id: 0389274e-d15c-416e-88de-ecb30f599aab
                  settlement_type: E_COLLECT
                  virtual_account_number: '4625257719628478'
                  default_split_settlement_rule_urn: 43CB10225A0448119CD39BE8487BC4A0
              Nach:
                value:
                  reference_id: 0389274e-d15c-416e-88de-ecb30f599aab
                  settlement_type: NACH
                  consumer_urn: 820D7E712A594AF6A162241081AA1532
                  default_split_settlement_rule_urn: 43CB10225A0448119CD39BE8487BC4A0
              Autopay:
                value:
                  reference_id: 0389274e-d15c-416e-88de-ecb30f599aab
                  settlement_type: UPI_AUTOPAY
                  consumer_urn: 820D7E712A594AF6A162241081AA1532
                  default_split_settlement_rule_urn: 43CB10225A0448119CD39BE8487BC4A0
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Default Settlement Config saved successfully:
                  value: "{\n    \"decentro_txn_id\": \"96C55AFDE9FD4BF9AA7CB9E9982569A5\",\n    \"api_status\": \"SUCCESS\",\n    \"message\": \"Default Settlement Config saved successfully.\",\n    \"data\":\n    {\n        \"default_split_settlement_urn\": \"DD31C52176DB4F068C08E7FDBAE2E2CB\",\n        \"default_split_settlement_rule\":\n        [\n            {\n                \"percentage\": 1.0,\n                \"commission_deduction\": true,\n                \"settlement_account_urn\": \"12341B04125744CAAC39CCD20431D92F\"\n            },\n            {\n                \"percentage\": 99.0,\n                \"commission_deduction\": false,\n                \"settlement_account_urn\": \"12341B04125744CAAC39CCD20431D92F\"\n            }\n        ]\n    },\n    \"response_key\": \"success_default_settlement_config_saved_successfully\"\n}"
              schema:
                type: object
                properties:
                  decentro_txn_id:
                    type: string
                    example: 96C55AFDE9FD4BF9AA7CB9E9982569A5
                  api_status:
                    type: string
                    example: SUCCESS
                  message:
                    type: string
                    example: Default Settlement Config saved successfully.
                  data:
                    type: object
                    properties:
                      default_split_settlement_urn:
                        type: string
                        example: DD31C52176DB4F068C08E7FDBAE2E2CB
                      default_split_settlement_rule:
                        type: array
                        items:
                          type: object
                          properties:
                            percentage:
                              type: integer
                              example: 1
                              default: 0
                            commission_deduction:
                              type: boolean
                              example: true
                              default: true
                            settlement_account_urn:
                              type: string
                              example: 12341B04125744CAAC39CCD20431D92F

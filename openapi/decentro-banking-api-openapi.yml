  /v3/banking/account/statement:
    get:
      summary: Get Virtual Account Statement
      description: This API can be used by platforms to fetch the statement of a virtual account.
      operationId: payments_api-virtualaccounts3-statement
      parameters:
      - name: client_id
        in: header
        required: true
        schema:
          type: string
      - name: client_secret
        in: header
        required: true
        schema:
          type: string
      - name: from
        in: query
        description: 'The starting date and time when the statement needs to be fetched. Format: %Y-%m-%d %H:%M:%S'''
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: 'The ending date and time when the statement needs to be fetched. Format: %Y-%m-%d %H:%M:%S'''
        required: true
        schema:
          type: string
          format: date-time
      - name: consumer_urn
        in: query
        description: A unique identifier assigned to each merchant by Decentro during onboarding.
        required: true
        schema:
          type: string
      - name: virtual_account_number
        in: query
        description: Virtual account number as requested by the platform.
        schema:
          type: string
      - name: page
        in: query
        description: The page number for viewing the account statement. Should be a valid positive integer.
        required: true
        schema:
          type: string
      - name: custom_va_number
        in: query
        description: 'The suffix part of the VA that uniquely identifies each VA. It can be from 6 -10 digit. Eg: va_suffix will be 000001 for virtual account number 46525000001'
        schema:
          type: string
      - name: customer_va_identifier
        in: query
        description: Unique customer identifier that is mapped against the virtual account.
        schema:
          type: string
      - name: x_on_behalf_of
        in: header
        description: Optional header that allows parent merchant to consume the API on behalf of sub-merchant.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                'Success: Get statement via virtual account number':
                  value: "{\n    \"decentro_txn_id\": \"179BC4C397744F45AF27E40033566C16\",\n    \"api_status\": \"SUCCESS\",\n    \"message\": \"Statement fetched successfully.\",\n    \"data\": {\n        \"name\": \"jhon doe\",\n        \"from\": \"2024-07-10T10:30:00\",\n        \"to\": \"2024-07-21T00:16:54\",\n        \"total_count\": 151,\n        \"withdrawal_count\": 77,\n        \"deposit_count\": 74,\n        \"opening_balance\": 0.0,\n        \"closing_balance\": 702.5651,\n        \"statement\": [\n            {\n                \"timestamp\": \"2024-07-16T15:33:49\",\n                \"description\": \"NA\",\n                \"bank_reference_number\": \"5127037\",\n                \"decentro_txn_id\": \"4C07B636347B410C849BA0316DFC8C01\",\n                \"amount\": 1.0,\n                \"updated_balance\": 1.0,\n                \"type\": \"CREDIT\",\n                \"transaction_type\": \"MAIN\",\n                \"transaction_status\": \"SUCCESS\",\n                \"transfer_type\": \"IMPS\",\n                \"beneficiary_account_number\": \"YESB010035837506\",\n                \"beneficiary_account_ifsc\": \"YESB0CMSNOC\",\n                \"sender_account_number\": \"87654359000011\",\n                \"sender_account_ifsc\": \"ICIC0000107\"\n            },\n            {\n                \"timestamp\": \"2024-07-16T15:33:52\",\n                \"description\": \"NA\",\n                \"bank_reference_number\": \"1227594\",\n                \"decentro_txn_id\": \"0D9BEF4C40EE48CDA62ACCB380A17911\",\n                \"amount\": 1.0,\n                \"updated_balance\": 2.0,\n                \"type\": \"CREDIT\",\n                \"transaction_type\": \"MAIN\",\n                \"transaction_status\": \"SUCCESS\",\n                \"transfer_type\": \"NEFT\",\n                \"beneficiary_account_number\": \"YESB010035837506\",\n                \"beneficiary_account_ifsc\": \"YESB0CMSNOC\",\n                \"sender_account_number\": \"87654359000011\",\n                \"sender_account_ifsc\": \"ICIC0000107\"\n            },\n            {\n                \"timestamp\": \"2024-07-16T15:51:45\",\n                \"description\": \"Testing\",\n                \"bank_reference_number\": \"1234567890\",\n                \"decentro_txn_id\": \"417AC5275A7A45DFB151F6C3DE5E3792\",\n                \"amount\": 1.0,\n                \"updated_balance\": 7.0,\n                \"type\": \"DEBIT\",\n                \"transaction_type\": \"MAIN\",\n                \"transaction_status\": \"SUCCESS\",\n                \"transfer_type\": \"IMPS\",\n                \"beneficiary_account_number\": \"218901504450\",\n                \"beneficiary_account_ifsc\": \"ICIC0002189\",\n                \"sender_account_number\": \"YESB010035837506\",\n                \"sender_account_ifsc\": \"YESB0CMSNOC\"\n            }\n        ]\n    },\n    \"response_key\": \"success_account_statement_fetched\"\n}"

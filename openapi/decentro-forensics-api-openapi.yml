openapi: 3.2.0
info:
  title: Decentro KYC & Onboarding Accounts Forensics API
  description: Decentro's KYC & Onboarding API provides identity verification, customer onboarding workflows, and document/face forensics for Indian financial services.
  version: '1.0'
  contact:
    name: Decentro
    url: https://decentro.tech/
servers:
- url: https://in.decentro.tech
  description: India production
- url: https://staging.decentro.tech
  description: Staging
security:
- apiKey: []
tags:
- name: Forensics
paths:
  /v2/kyc/forensics/document_classification:
    post:
      summary: Classify document
      operationId: classifyDocument
      tags:
      - Forensics
      responses:
        '200':
          description: Document classification result.
  /v2/kyc/forensics/face_match:
    post:
      summary: Face match
      operationId: faceMatch
      tags:
      - Forensics
      responses:
        '200':
          description: Face match score.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: client_secret

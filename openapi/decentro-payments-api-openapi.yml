  /v3/payments/upi/collect:
    post:
      summary: Issue Collect Request
      description: ''
      operationId: payments_v3-collectrequest
      parameters:
      - name: client_id
        in: header
        description: Decentro assigned client_id during on boarding.
        required: true
        schema:
          type: string
      - name: client_secret
        in: header
        description: Decentro assigned client_secret during on boarding.
        required: true
        schema:
          type: string
      - name: x_on_behalf_of
        in: header
        description: This allows parent merchant to consume the API on behalf of sub-merchant.
        schema:
          type: string
          default: '{{sub_merchant_consumer_urn}}'
      - name: x_device_os
        in: header
        description: The the device and browser type of the payer. Possible values - android_mobile, ios_mobile, desktop_web
        schema:
          type: string
      - name: authorization
        in: header
        description: Customers can generate JWT using our Auth API with various grant types in the request body. JWT is valid for 15minutes.
        schema:
          type: string
          default: Bearer {{JWT}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reference_id
              - consumer_urn
              - amount
              - expiry_time
              - payer_name
              - payer_vpa
              properties:
                reference_id:
                  type: string
                  description: A unique ID assigned by the user for this transaction.
                consumer_urn:
                  type: string
                  description: A unique identifier assigned to client's by Decentro during On boarding.
                amount:
                  type: integer
                  description: The transaction amount you want to collect. Min = 5.00 and MAX = 100000.00. The limits on the amount can be changed depending on merchant use case. Please contact support@decentro.tech for further assistance.
                  format: int32
                purpose_message:
                  type: string
                  description: 'The narration that you want to show as a message for the transfer. (Note: Purpose message must be less than 50 characters).'
                expiry_time:
                  type: integer
                  format: int32
                payer_name:
                  type: string
                  description: Name of the Payer, I.E., the end customer associated with the UPI VPA.
                payer_vpa:
                  type: string
                  description: UPI VPA/ID of the payer.
                account_number:
                  type: string
                  description: Used for TPV. The number of the source bank account from which the payment must be made. Payments from any other account (mapped to the UPI ID) will be rejected.
                account_ifsc:
                  type: string
                  description: Used for TPV. The IFSC number of the source bank account from which the payment must be made. Payments from any other account (mapped to the UPI ID) will be rejected.
                split_settlement_rule_urn:
                  type: string
                  description: This param will help us to identify the split settlement rule at transaction level.
            examples:
              'Collect Request: Success':
                value:
                  reference_id: d0ae238f-4761-4436-bdf0-3db5ea593a1e
                  consumer_urn: 820D7E712A594AF6A162241081AZ922
                  amount: 10
                  purpose_message: Test
                  expiry_time: 60
                  payer_name: customer
                  payer_vpa: customert@bank
                  split_settlement_rule_urn: XXXXXX
                  payer_details:
                    account_number: '98787686860006'
                    account_ifsc: AHVH9828198
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                'Collect Request: Success Response':
                  value: "{\n    \"decentro_txn_id\": \"B8C9C661C92443D09C1506F0A02DB6DE\",\n    \"api_status\": \"SUCCESS\",\n    \"message\": \"Collection request created successfully.\",\n    \"data\":\n    {\n        \"transaction_status\": \"PENDING\",\n        \"bank_reference_number\": \"XXXXX\"\n    },\n    \"response_key\": \"success_payment_collect_request_created\"\n}"
              schema:
                type: object
                properties:
                  decentro_txn_id:
                    type: string
                    example: B8C9C661C92443D09C1506F0A02DB6DE
                  api_status:
                    type: string
                    example: SUCCESS
                  message:
                    type: string
                    example: Collection request created successfully.
                  data:
                    type: object
                    properties:
                      transaction_status:
                        type: string
                        example: PENDING
                      bank_reference_number:
                        type: string
                        example: XXXXX
                  response_key:
                    type: string
                    example: success_payment_collect_request_created
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Bad/Missing/Invalid Input:
                  value: '{}'
                Service Deprecated:
                  value: "{\n    \"decentro_txn_id\": \"DECXXX79AA9C2457ABFE58B472A0E6\",\n    \"api_status\": \"FAILURE\",\n    \"message\": \"As per NPCI directives, this service is not available for the Merchant Category Code (MCC) assigned to you. Please reach out to our support team for more information.\",\n    \"response_key\": \"error_service_deprecated\"\n}"
              schema:
                oneOf:
                - title: Bad/Missing/Invalid Input
                  type: object
                  properties: {}
                - title: Service Deprecated
                  type: object
                  properties:
                    decentro_txn_id:
                      type: string
                      example: DECXXX79AA9C2457ABFE58B472A0E6
                    api_status:
                      type: string
                      example: FAILURE
                    message:
                      type: string
                      example: As per NPCI directives, this service is not available for the Merchant Category Code (MCC) assigned to you. Please reach out to our support team for more information.
                    response_key:
                      type: string
                      example: error_service_deprecated
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Request Uninitialized:
                  value: "{\n    \"decentro_txn_id\": \"ACE34FE88B83494D8D3A383EEF1F276D\",\n    \"api_status\": \"FAILURE\",\n    \"message\": \"Channel template not found, please contact your account manager for activating this payment channel.\",\n    \"data\": {\n        \"transaction_status\": \"REQUEST_UNINITIALIZED\"\n    },\n    \"response_key\": \"error_request_uninitialized\"\n}"
              schema:
                type: object
                properties:
                  decentro_txn_id:
                    type: string
                    example: ACE34FE88B83494D8D3A383EEF1F276D
                  api_status:
                    type: string
                    example: FAILURE
                  message:
                    type: string
                    example: Channel template not found, please contact your account manager for activating this payment channel.
                  data:
                    type: object
                    properties:
                      transaction_status:
                        type: string
                        example: REQUEST_UNINITIALIZED
                  response_key:
                    type: string
                    example: error_request_uninitialized
      deprecated: false
      tags:
      - Payments

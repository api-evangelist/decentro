  /v3/payments/enach/mandate/execute:
    post:
      summary: Enach Mandate Execution
      description: This API allows the platform to initiate a presentation using Decentro's ENACH V3 stack.
      operationId: enach-v3-mandate-execution
      parameters:
      - name: client_id
        in: header
        required: true
        schema:
          type: string
      - name: client_secret
        in: header
        required: true
        schema:
          type: string
      - name: x_on_behalf_of
        in: header
        description: Optional header that allows parent merchant to consume the API on behalf of sub-merchant.
        schema:
          type: string
          default: '{{sub_merchant_consumer_urn}}'
      - name: authorization
        in: header
        description: Customers can generate JWT using our Auth API with various grant types in the request body. JWT is valid for 15minutes.
        schema:
          type: string
          default: Bearer {{JWT}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reference_id
              - decentro_mandate_id
              - debit_date
              - amount
              properties:
                reference_id:
                  type: string
                  description: A specific unique ID assigned by you for this transaction. If not kept unique, transaction status extraction could behave erratically.
                decentro_mandate_id:
                  type: string
                  description: The unique identifier propagated by Decentro in the mandate registration API.
                debit_date:
                  type: string
                  description: The date when the funds need to be debited from the payer's account.
                  format: date
                amount:
                  type: number
                  description: The amount that needs to be debited and needs to be lesser than or equal to the registration amount.
                  default: 1000
                  format: float
                split_settlement_rule_urn:
                  type: string
                  description: This param will help us to identify the split settlement rule at transaction level.
                  default: XXXXX
            examples:
              Success:
                value:
                  reference_id: DCTRTXXXXXXXXXXXXXXXXX
                  decentro_mandate_id: BKXXXXXXXX8
                  debit_date: YYYY-MM-DD
                  split_settlement_rule_urn: xxxxxxxx
                  amount: 1000
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Success:
                  value: "{\n  \"decentro_txn_id\": \"3B8ABE0E394045998A3103C6CDAE94B7\",\n  \"api_status\": \"SUCCESS\",\n  \"message\": \"Successfully initiated the mandate execution.\",\n  \"data\": {\n    \"presentation_status\": \"INITIATED\",\n    \"decentro_mandate_id\": \"2C9E1C0FC3B240369B4B8E7AF9CE8179\",\n    \"amount\": 500.0\n    },\n  \"response_key\": \"success_mandate_execution_initiated\"\n}"
              schema:
                type: object
                properties:
                  decentro_txn_id:
                    type: string
                    example: 3B8ABE0E394045998A3103C6CDAE94B7
                  api_status:
                    type: string
                    example: SUCCESS
                  message:
                    type: string
                    example: Successfully initiated the mandate execution.
                  data:
                    type: object
                    properties:
                      presentation_status:
                        type: string
                        example: INITIATED
                      decentro_mandate_id:
                        type: string
                        example: 2C9E1C0FC3B240369B4B8E7AF9CE8179
                      amount:
                        type: integer
                        example: 500
                        default: 0
                  response_key:
                    type: string
                    example: success_mandate_execution_initiated
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Failure:
                  value: "{\n    \"decentro_txn_id\": \"88F94A10F3CD4906BBE573F6529DE317\",\n    \"status\": \"FAILURE\",\n    \"message\": \"Debit date is older than today. Hint: debit_date(string), format: yyyy-mm-dd\",\n    \"response_key\": \"error_old_debit_date\"\n}"
              schema:
                type: object
                properties:
                  decentro_txn_id:
                    type: string
                    example: 88F94A10F3CD4906BBE573F6529DE317
                  status:
                    type: string
                    example: FAILURE
                  message:
                    type: string
                    example: 'Debit date is older than today. Hint: debit_date(string), format: yyyy-mm-dd'
                  response_key:
                    type: string
                    example: error_old_debit_date
      deprecated: false
      tags:
      - Payments

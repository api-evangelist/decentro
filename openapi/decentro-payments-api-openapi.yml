  /v3/payments/transaction/advance/status?{decentro_txn_id}:
    get:
      summary: Get Transaction Status Advance
      description: This API allows the platform to fetch the status of a each attempt made by the user on a particular Payment link/Dynamic QR transaction/ UPI Autopay(Refunds only).
      operationId: get-transaction-status-advance
      parameters:
      - name: client_id
        in: header
        description: Decentro assigned client_id during on boarding.
        required: true
        schema:
          type: string
      - name: client_secret
        in: header
        description: Decentro assigned client_secret during on boarding.
        required: true
        schema:
          type: string
      - name: decentro_txn_id
        in: query
        description: The Decentro transaction id that you received in the payment link response.
        schema:
          type: string
      - name: reference_id
        in: query
        description: The reference_id passed during initial payment request.
        schema:
          type: string
      - name: authorization
        in: header
        description: Customers can generate JWT using our Auth API with various grant types in the request body. JWT is valid for 15minutes.
        schema:
          type: string
          default: Bearer {{JWT}}

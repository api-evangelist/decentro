  /v3/payments/upi/qr:
    post:
      summary: Generate Dynamic QR
      description: This API allows the platform to create a dynamic QR code using Decentro's UPI stack.
      operationId: payments_api-collectionsv3-dynamicqr
      parameters:
      - name: client_id
        in: header
        description: Decentro assigned client_id during on boarding.
        required: true
        schema:
          type: string
      - name: client_secret
        in: header
        description: Decentro assigned client_secret during on boarding.
        required: true
        schema:
          type: string
      - name: x_on_behalf_of
        in: header
        description: This allows parent merchant to consume the API on behalf of sub-merchant.
        schema:
          type: string
          default: '{{sub_merchant_consumer_urn}}'
      - name: authorization
        in: header
        description: Customers can generate JWT using our Auth API with various grant types in the request body. JWT is valid for 15minutes.
        schema:
          type: string
          default: Bearer {{JWT}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reference_id
              - consumer_urn
              - amount
              - purpose_message
              - expiry_time
              properties:
                reference_id:
                  type: string
                  description: A unique ID assigned by clients for every API request.
                consumer_urn:
                  type: string
                  description: A unique identifier assigned to client's by Decentro during On boarding.
                amount:
                  type: string
                  description: The transaction amount (in INR) you intent to collect. Min =  5.00 and MAX = 100000.00. The limits on the amount can be changed depending on merchant use case. Please contact support@decentro.tech for further assistance.
                  default: '1000'
                purpose_message:
                  type: string
                  description: 'The narration that you want to show as a message for the transfer. (Note: Purpose message must be less than 50 characters).'
                  default: Generate QR
                generate_custom_qr_image:
                  type: boolean
                  description: 'true/false depending on the choice to generate custom QR code with client''s logo uploaded during on boarding. Default value: false'
                  default: false
                expiry_time:
                  type: string
                  description: Time parameter in minutes after which the QR will get expired. Max value = 1440 minutes (1 day)).
                redirect_url:
                  type: string
                  description: The custom URL where the user will be redirected after the payment session. Only "https://" endpoints will be accepted.
                account_number:
                  type: string
                  description: Used for TPV. The number of the source bank account from which the payment must be made. Payments from any other account (mapped to the UPI ID) will be rejected.
                account_ifsc:
                  type: string
                  description: Used for TPV. The IFSC number of the source bank account from which the payment must be made. Payments from any other account (mapped to the UPI ID) will be rejected.
                split_settlement_rule_urn:
                  type: string
                  description: This param will help us to identify the split settlement rule at transaction level.
            examples:
              SUCCESS:
                value:
                  reference_id: 2fbf2d07-4ed5-443d-a3a2-0e1a87e45a87
                  consumer_urn: 505EB893ECCC43BA84AA85ECFF6D3776
                  amount: 10
                  purpose_message: Testing
                  expiry_time: 10
                  generate_custom_qr_image: true
                  split_settlement_rule_urn: XXXXXX
                  payer_details:
                  - account_number: '98787686868686'
                    account_ifsc: ICIC0003464
                  redirect_url: https://decentro.tech
              'FAILURE: Bad/missing/invalid inputs':
                value:
                  reference_id: '{{$randomUUID}}'
                  consumer_urn: <some invalid consumer urn>
                  amount: 14
                  purpose_message: test_hygience_01
                  expiry_time: 100
                  redirect_url: https://www.google.com
                  generate_custom_qr_image: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                'SUCCESS: QR generated':
                  value: "{\n    \"decentro_txn_id\": \"01ED978xxxxxxxxxxxx57B322E9717\",\n    \"api_status\": \"SUCCESS\",\n    \"message\": \"Payment QR created Successfully.\",\n    \"data\": {\n        \"dynamic_qr_image\": \"<link containing qr image>\",\n        \"transaction_status\": \"PENDING\"\n    },\n    \"response_key\": \"success_payment_qr_created\"\n}"
              schema:
                type: object
                properties:
                  decentro_txn_id:
                    type: string

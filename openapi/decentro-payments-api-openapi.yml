openapi: 3.2.0
info:
  title: Decfin Staging Payments API
  version: '1.0'
servers:
- url: https://staging.api.decentro.tech
security:
- {}
tags:
- name: Payments
paths:
  /v3/payments/upi/autopay/mandate/link:
    post:
      summary: Create Mandate API
      description: This API is used to create a UPI based mandate.
      operationId: payments_api-upi-autopay-create-mandate
      parameters:
      - name: client_id
        in: header
        description: Decentro assigned client_id during on boarding.
        required: true
        schema:
          type: string
      - name: client_secret
        in: header
        description: Decentro assigned client_secret during on boarding.
        required: true
        schema:
          type: string
      - name: x_on_behalf_of
        in: header
        description: Optional header that allows parent merchant to consume the API on behalf of sub-merchant.
        schema:
          type: string
          default: '{{sub_merchant_consumer_urn}}'
      - name: authorization
        in: header
        description: Customers can generate JWT using our Auth API with various grant types in the request body. JWT is valid for 15minutes.
        schema:
          type: string
          default: Bearer {{JWT}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reference_id
              - consumer_urn
              - mandate_name
              - amount
              - frequency
              - rule_type
              - amount_rule
              - start_date
              - end_date
              - expiry_time
              - is_downpayment
              - is_first_txn_amount
              - generate_psp_uri
              - is_managed_by_decentro
              - is_qr_requested
              - is_block_funds
              - is_revokable
              - is_collect_request
              - is_tpv
              properties:
                reference_id:
                  type: string
                  description: A specific unique ID assigned by you for this transaction. If not kept unique, transaction status extraction could behave erratically.
                consumer_urn:
                  type: string
                  description: A unique identifier provided by Decentro at the time of onboarding
                mandate_name:
                  type: string
                  description: Name of the mandate/subscription
                amount:
                  type: number
                  description: 'Mandate Amount. Min: 1. Max: 1,00,000'
                  format: float
                frequency:
                  type: string
                  description: Frequency of the debits (Onetime, Monthly, Weekly, Daily, Quarterly, Bimonthly, Fortnightly, Halfyearly, Yearly, Aspresented)
                purpose_message:
                  type: string
                  description: The narration that you want to show as a message for the mandate registration.
                rule_type:
                  type: string
                  description: Type of Rule (ON / BEFORE / AFTER). If frequency is other than ONETIME/AS PRESENTED/DAILY, then rule_type is mandatory
                amount_rule:
                  type: string
                  description: 'Mandate amount rule: (MAX or FIXED) MAX: Maximum amount FIXED: Exact amount'
                start_date:
                  type: string
                  description: Mandate start date. Needs to be on and after the date when the API is triggered.
                  format: date
                end_date:
                  type: string
                  description: Mandate end date. Needs to be after the date when the API is triggered. Max tenure is 30 years
                  format: date
                expiry_time:
                  type: integer
                  description: 'Expiry Time of the mandate within 24 hrs and data to be provided in Minutes. Min: 1. Max: 1440'
                  format: int32
                default_amount:
                  type: number
                  description: The default amount to be used for presentation. Mandatory if amount_rule = MAX
                  format: float
                is_downpayment:
                  type: string
                  description: To enable any instant presentation, pass this flag as True; Else pass as False. Amount will be deducted immediately after mandate registration. is_downpayment flag & is_first_txn_amount flag can't set as true at a same time.
                is_first_txn_amount:
                  type: string
                  description: If set to true, the mandate will be treated as a First Amount Mandate. Only supported for QR/Intent-based Autopay flows. In FAM, the amount rule type must be set to MAX. is_downpayment flag & is_first_txn_amount flag can't set as true at a same time.
                generate_psp_uri:
                  type: string
                  description: true/ false depending on the choice to generate UPI mandate URI/intent flow to implement customized flow based on URI data.
                is_managed_by_decentro:
                  type: string
                  description: This param is used to identify if the mandate is managed by Decentro. Accepted values true or false.
                is_qr_requested:
                  type: string
                  description: This flag is used to identify whether the QR code is requested. Pass true for QR code and false for no QR code.
                is_block_funds:
                  type: string
                  description: This flag is used to block funds in the user's bank account. This feature is available only for one-time mandates and lending MCCs. Accepted values are "true" to block funds, and "false" to not block funds.
                is_revokable:
                  type: string
                  description: 'This flag is used to set non-revokable mandates. It is available only for IPO and Lending MCCs. Accepted values are: "true" – the user can revoke the mandate, "false" – the mandate cannot be revoked by the user.'
                is_collect_request:
                  type: string
                  description: This flag is used to identify whether the merchant is initiating the collect request or intent link. Pass true for collect requests and false for intent. Supported MCCs 6012 & 6211.
                is_tpv:
                  type: string
                  description: This flag is used to identify whether the collect request requires third-party validation. TPV will only work for collect requests.
                payer_details:
                  type: object
                  description: This object is required only if "is_collect_request" is set to true.
                  required:
                  - name
                  - virtual_address
                  properties:
                    name:
                      type: string
                      description: Name of the payer
                    virtual_address:
                      type: string
                      description: VPA of the payer
                    account_no:
                      type: string
                      description: This is required only if the "is_tpv" flag is set to true. The payer can register the mandates only from the above-mentioned bank account number.
                mandate_action_callback_subscriber_data:
                  type: object
                  description: Custom endpoint for sharing the Mandate Status Callback. This will override the default callback endpoints configured for your account.
                  properties:
                    url:
                      type: string
                      description: The callback URL to receive the latest mandate status updates.
                    headers:
                      type: object
                      description: The header required
                      properties:
                        content-type:
                          type: string
                          description: The header content required for posting the callback
                redirect_url:
                  type: string
                  description: This is a optional parameter. Merchants can pass the redirection URL. Max support of characters are 2048. Only "https://" endpoints will be accepted.
                additional_fields:
                  type: array
                  items:
                    properties:
                      mutual_funds_order:
                        type: object
                        description: This is an array of objects. Multiple mutual funds details can be passed here
                        properties:
                          member_id:
                            type: string
                          user_id:
                            type: string
                          mf_partner:
                            type: string
                          folio_number:
                            type: string
                          order_number:
                            type: string
                          amount:
                            type: string
                          scheme_code:
                            type: string
                          amc_code:
                            type: string
                          pan_number:
                            type: string
                          investment_type:
                            type: string
                    type: object
                downpayment_reference_id:
                  type: string
                  description: This reference_id will be used to initiate the instant presentations(5mins presentations). Value will be passed only if is_downpayment flag is set as true
                first_txn_amount_reference_id:
                  type: string
                  description: This reference_id will be used to initiate the instant presentations(5mins presentations). Value will be passed only if is_first_txn_amount flag is set as true
            examples:
              Success - Intent Link:
                value:
                  reference_id: '{{$randomUUID}}'
                  consumer_urn: '{{consumer_urn}}'
                  mandate_name: TPV Testing
                  amount: 1
                  frequency: weekly
                  purpose_message: TPV Testing
                  rule_type: AFTER
                  amount_rule: MAX
                  start_date: '2025-03-28'
                  end_date: '2025-04-29'
                  expiry_time: 10
                  default_amount: 1
                  is_managed_by_decentro: false
                  is_qr_requested: true
                  is_block_funds: false
                  is_revokable: false
                  is_collect_request: false
                  is_tpv: false
                  generate_psp_uri: false
                  is_downpayment: true
                  is_first_txn_amount: false
                  redirect_url: https://www.decentro.tech
                  mandate_action_callback_subscriber_data:
                    url: https://webhook.site/XXXX
                    method: POST
                    headers:
                      content-type: application/json
              Success - Collect Requests:
                value:
                  reference_id: '1234'
                  consumer_urn: XXXXXXXXXXXXXX
                  mandate_name: TPV Testing
                  amount: 1
                  frequency: weekly
                  purpose_message: TPV Testing
                  rule_type: AFTER
                  amount_rule: MAX
                  start_date: '2025-03-28'
                  end_date: '2025-04-29'
                  expiry_time: 10
                  default_amount: 1
                  is_managed_by_decentro: false
                  is_qr_requested: true
                  is_block_funds: false
                  is_revokable: false
                  is_collect_request: true
                  is_tpv: false
                  payer_details:
                    name: abc
                    virtual_address: nihal@okhdfcbank
                  generate_psp_uri: false
                  is_downpayment: true
                  is_first_txn_amount: false
                  redirect_url: https://www.decentro.tech
                  mandate_action_callback_subscriber_data:
                    url: https://webhook.site/XXXX
                    method: POST
                    headers:
                      content-type: application/json
              Failure -  Invalid date:
                value:
                  reference_id: '{{$randomUUID}}'
                  consumer_urn: XXXXX
                  mandate_name: XXXXX
                  amount: 100
                  frequency: WEEKLY
                  is_managed_by_decentro: true
                  purpose_message: Internal Testing
                  rule_type: after
                  amount_rule: FIXED
                  default_amount: 100
                  is_downpayment: true
                  is_first_txn_amount: false
                  start_date: '2025-03-05'
                  end_date: '2025-03-28'
                  expiry_time: 1
                  generate_psp_uri: true
                  is_qr_requested: true
                  is_block_funds: false
                  is_revokable: false
                  is_collect_request: true
                  is_tpv: false
                  payer_details:
                    name: abc
                    virtual_address: nihal@okhdfcbank
                  is_custom_qr_requested: true
                  redirect_url: https://www.decentro.tech
                  mandate_action_callback_subscriber_data:
                    url: https://webhook.site/XXXXX
                    method: POST
                    headers:
                      content-type: application/json
              Success - Collect Request with TPV:
                value:
                  reference_id: '1234'
                  consumer_urn: XXXXXXXXXXXXXX
                  mandate_name: TPV Testing
                  amount: 1
                  frequency: weekly
                  purpose_message: TPV Testing
                  rule_type: AFTER
                  amount_rule: MAX
                  start_date: '2025-03-28'
                  end_date: '2025-04-29'
                  expiry_time: 10
                  default_amount: 1
                  is_managed_by_decentro: false
                  is_qr_requested: true
                  is_block_funds: false
                  is_revokable: false
                  is_collect_request: true
                  is_tpv: true
                  payer_details:
                    name: abc
                    virtual_address: nihal@okhdfcbank
                    account_no: '50100'
                  generate_psp_uri: false
                  is_downpayment: true
                  is_first_txn_amount: false
                  redirect_url: https://www.decentro.tech
                  mandate_action_callback_subscriber_data:
                    url: https://webhook.site/XXXX
                    method: POST
                    headers:
                      content-type: application/json
              Success - Mutual Funds Details:
                value:
                  reference_id: '{{$randomUUID}}'
                  consumer_urn: '{{consumer_urn}}'
                  mandate_name: 123 subscription
                  amount: 100
                  frequency: ASPRESENTED
                  default_amount: 100
                  purpose_message: Autopay monthly testing
                  amount_rule: MAX
                  start_date: '2025-05-20'
                  end_date: '2025-05-29'
                  expiry_time: 30
                  is_qr_requested: false
                  is_custom_qr_requested: false
                  is_collect_request: true
                  is_tpv: true
                  is_downpayment: true
                  is_first_txn_amount: false
                  payer_details:
                    name: Divyanshi
                    account_no: '1235035830935'
                    virtual_address: divyanshi@oksbi
                  additional_fields:
                    mutual_funds_order:
                    - member_id: ABCDE
                      user_id: ABCDEFGHIJ
                      mf_partner: BSE
                      folio_number: '190983010'
                      order_number: order_zer12345ssss
                      amount: '800'
                      scheme_code: LT
                      amc_code: UYTIUI
                      pan_number: TYLIO7823U
                      investment_type: LUMPSUM
                    - member_id: ABCDE
                      user_id: ABCDEFGHIJ
                      mf_partner: BSE
                      folio_number: '190983010'
                      order_number: order_zer12345ssss
                      amount: '800'
                      scheme_code: LT
                      amc_code: UYTIUI
                      pan_number: TYLIO7823U
                      investment_type: LUMPSUM
                  is_block_funds: false
                  is_revokable: true
                  redirect_url: https://www.google.com
                  generate_psp_uri: true
                  mandate_action_callback_subscriber_data:
                    method: POST
                    url: https://webhook.site/98df552d-76cb-4111-a706-ae86566560a3
                    headers:
                      content-type: application/json
              Success - FAM:
                value:
                  reference_id: '{{$randomUUID}}'
                  consumer_urn: '{{consumer_urn}}'
                  mandate_name: TPV Testing
                  amount: 1
                  frequency: weekly
                  purpose_message: TPV Testing
                  rule_type: AFTER
                  amount_rule: MAX
                  start_date: '2025-03-28'
                  end_date: '2025-04-29'
                  expiry_time: 10
                  default_amount: 1
                  is_managed_by_decentro: false
                  is_qr_requested: true
                  is_block_funds: false
                  is_revokable: false
                  is_collect_request: false
                  is_tpv: false
                  generate_psp_uri: false
                  is_downpayment: false
                  is_first_txn_amount: true
                  redirect_url: https://www.decentro.tech
                  mandate_action_callback_subscriber_data:
                    url: https://webhook.site/XXXX
                    method: POST
                    headers:
                      content-type: application/json
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Success - Intent Link:
                  value: "{\n    \"decentro_txn_id\": \"E20EAB451D8E4F478F4826E7A2D42776\",\n    \"api_status\": \"SUCCESS\",\n    \"message\": \"Mandate link created successfully.\",\n    \"data\": {\n        \"mandate_detail\": {\n            \"decentro_mandate_id\": \"81F2C8CFB913414CAAD2ABDCC48D71C8\",\n              \"mandate_status\": \"PENDING\",\n              \"presentation_sequence_id\": \"DFN-XXXX-0001\",\n            \"mandate_links\": {\n                \"common_uri\": \"https://decpay.in/upi/mandate/xbpcgdcz\",\n                \"gpay_uri\": \"https://decpay.in/upi/mandate/xbpgdcz?app=gpay\",\n                \"phonepe_uri\": \"https://decpay.in/upi/mandate/xbpcgdcz?app=phonepe\",\n                \"paytm_uri\": \"https://decpay.in/upi/mandate/xbpcv8gcz?app=paytm\"\n            }\n        }\n    },\n    \"response_key\": \"success_mandate_link_created\"\n}"
                Success - Collect Requests:
                  value: "{\n    \"decentro_txn_id\": \"915763AC40EB46F0A2BF8C8A38310499\",\n    \"api_status\": \"SUCCESS\",\n    \"message\": \"Mandate link created successfully.\",\n    \"data\": {\n        \"mandate_detail\": {\n            \"decentro_mandate_id\": \"92BF286EECA74EB8AFE790E3C5AE3651\",\n            \"mandate_status\": \"PENDING\"\n        }\n    },\n    \"response_key\": \"success_mandate_link_created\"\n}"
                Success - Collect Request with TPV:
                  value: "{\n    \"decentro_txn_id\": \"915763AC40EB46F0A2BF8C8A38310499\",\n    \"api_status\": \"SUCCESS\",\n    \"message\": \"Mandate link created successfully.\",\n    \"data\": {\n        \"mandate_detail\": {\n            \"decentro_mandate_id\": \"92BF286EECA74EB8AFE790E3C5AE3651\",\n              \"mandate_status\": \"PENDING\",\n              \"presentation_sequence_id\": \"DFN-XXXX-0001\",\n\n        }\n    },\n    \"response_key\": \"success_mandate_link_created\"\n}"
              schema:
                oneOf:
                - title: Success - Intent Link
                  type: object
                  properties:
                    decentro_txn_id:
                      type: string
                      example: E20EAB451D8E4F478F4826E7A2D42776
                    api_status:
                      type: string
                      example: SUCCESS
                    message:
                      type: string
                      example: Mandate link created successfully.
                    data:
                      type: object
                      properties:
                        mandate_detail:
                          type: object
                          properties:
                            decentro_mandate_id:
                              type: string
                              example: 81F2C8CFB913414CAAD2ABDCC48D71C8
                            mandate_status:
                              type: string
                              example: PENDING
                            presentation_sequence_id:
                              type: string
                              example: DFN-XXXX-0001
                            mandate_links:
                              type: object
                              properties:
                                common_uri:
                                  type: string
                                  example: https://decpay.in/upi/mandate/xbpcgdcz
                                gpay_uri:
                                  type: string
                                  example: https://decpay.in/upi/mandate/xbpgdcz?app=gpay
                                phonepe_uri:
                                  type: string
                                  example: https://decpay.in/upi/mandate/xbpcgdcz?app=phonepe
                                paytm_uri:
                                  type: string
                                  example: https://decpay.in/upi/mandate/xbpcv8gcz?app=paytm
                    response_key:
                      type: string
                      example: success_mandate_link_created
                - title: Success - Collect Requests
                  type: object
                  properties:
                    decentro_txn_id:
                      type: string
                      example: 915763AC40EB46F0A2BF8C8A38310499
                    api_status:
                      type: string
                      example: SUCCESS
                    message:
                      type: string
                      example: Mandate link created successfully.
                    data:
                      type: object
                      properties:
                        mandate_detail:
                          type: object
                          properties:
                            decentro_mandate_id:
                              type: string
                              example: 92BF286EECA74EB8AFE790E3C5AE3651
                            mandate_status:
                              type: string
                              example: PENDING
                    response_key:
                      type: string
                      example: success_mandate_link_created
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Failure -  Invalid date:
                  value: "{\n    \"decentro_txn_id\": \"57B9555A14534BB4A16D4DDA5B707DC8\",\n    \"api_status\": \"FAILURE\",\n    \"message\": \"End date cannot be less than present date.\",\n    \"response_key\": \"error_invalid_end_date\"\n}"
              schema:
                type: object
                properties:
                  decentro_txn_id:
                    type: string
                    example: 57B9555A14534BB4A16D4DDA5B707DC8
                  api_status:
                    type: string
                    example: FAILURE
                  message:
                    type: string
                    example: End date cannot be less than present date.
                  response_key:
                    type: string
                    example: error_invalid_end_date
      deprecated: false
      tags:
      - Payments
  /v3/payments/upi/autopay/mandate/notify:
    post:
      summary: Pre Debit Notification
      description: This API is used to initiate a pre-debit notification at least 24 hours before presenting the actual mandate.
      operationId: payments_api-upi-autopay-pre-debit-notification
      parameters:
      - name: client_id
        in: header
        description: Decentro assigned client_id during onboarding.
        required: true
        schema:
          type: string
      - name: client_secret
        in: header
        description: Decentro assigned client_secret during onboarding.
        required: true
        schema:
          type: string
      - name: x_on_behalf_of
        in: header
        description: Optional header that allows parent merchant to consume the API on behalf of sub-merchant.
        schema:
          type: string
          default: '{{sub_merchant_consumer_urn}}'
      - name: authorization
        in: header
        description: Customers can generate JWT using our Auth API with various grant types in the request body. JWT is valid for 15minutes.
        schema:
          type: string
          default: Bearer {{JWT}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reference_id
              - decentro_mandate_id
              - debit_date
              properties:
                reference_id:
                  type: string
                  description: A specific unique ID assigned by you for this transaction. If not kept unique, transaction status extraction could behave erratically.
                decentro_mandate_id:
                  type: string
                  description: Unique Decentro mandate ID for the Mandate received at the time of mandate creation.
                amount:
                  type: number
                  description: The debit amount for mandate presentation.
                  format: float
                debit_date:
                  type: string
                  description: The debit date on which funds should be deducted from payer's account.
                  format: date
                mandate_pdn_callback_subscriber_data:
                  type: object
                  description: mandate pre debit notification callback details
                  properties:
                    url:
                      type: string
                      description: The callback URL to receive the latest mandate status updates.
                    headers:
                      type: object
                      description: The header required
                      properties:
                        content-type:
                          type: string
                          description: The header content required for posting the callback
                auto_represent_on_failure:
                  type: boolean
                  description: The auto represent on failure flag allows merchant to auto represent a presentation which failed due to technical error code eligible for representation by NPCI
                  default: false
            examples:
              'Failure: Invalid input':
                value:
                  reference_id: 0000-0000-0000-0000
                  decentro_mandate_id: 1DDEFB37D0FD4A10BED3770A369068C0
                  amount: 100
                  debit_date: '2024-10-26'
              'Success : Notification Sent Successfully':
                value:
                  reference_id: '{{$randomUUID}}'
                  decentro_mandate_id: 48716E0XXX978D34
                  amount: 1
                  debit_date: '2026-04-28'
                  auto_represent_on_failure: true
                  mandate_pdn_callback_subscriber_data:
                    url: https://webhook.site/f6eaXXXXXXX
                    method: POST
                    headers:
                      content-type: application/json
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                'Success: Notification sent succesfully (Sync Flow - Deprecated)':
                  value: "{\n    \"decentro_txn_id\": \"F3148C353F7745A8AEF5D0CF96F33891\",\n    \"api_status\": \"SUCCESS\",\n    \"message\": \"Pre Debit Notification sent successfully.\",\n    \"data\": {\n        \"notification_detail\": {\n            \"notification_status\": \"SUCCESS\",\n            \"presentation_sequence_id\": \"DFN-63D5343CF3CD41C29A7F7C3DED8FAC63-00001\",\n            \"debit_date\": \"Jan 09, 2025, 12:00:00 AM\",\n            \"decentro_mandate_id\": \"63D5343CF3CD41C29A7F7C3DED8FAC63\",\n            \"amount\": \"100\"\n        }\n    },\n    \"response_key\": \"success_pre_debit_notification\"\n}"
                'Success: Notification sent successfully (Async Flow)':
                  value: "{\n    \"decentro_txn_id\": \"4F3B119BF3E2493B8D8422E97AB5B977\",\n    \"api_status\": \"SUCCESS\",\n    \"message\": \"Successfully initiated the pre-debit notification.\",\n    \"data\": {\n        \"notification_detail\": {\n            \"notification_status\": \"PENDING\"\n        }\n    },\n    \"response_key\": \"success_pre_debit_notification_initiated\"\n}\n"
              schema:
                oneOf:
                - title: 'Success: Notification sent succesfully (Sync Flow - Deprecated)'
                  type: object
                  properties:
                    decentro_txn_id:
                      type: string
                      example: F3148C353F7745A8AEF5D0CF96F33891
                    api_status:
                      type: string
                      example: SUCCESS
                    message:
                      type: string
                      example: Pre Debit Notification sent successfully.
                    data:
                      type: object
                      properties:
                        notification_detail:
                          type: object
                          properties:
                            notification_status:
                              type: string
                              example: SUCCESS
                            presentation_sequence_id:
                              type: string
                              example: DFN-63D5343CF3CD41C29A7F7C3DED8FAC63-00001
                            debit_date:
                              type: string
                              example: Jan 09, 2025, 12:00:00 AM
                            decentro_mandate_id:
                              type: string
                              example: 63D5343CF3CD41C29A7F7C3DED8FAC63
                            amount:
                              type: string
                              example: '100'
                    response_key:
                      type: string
                      example: success_pre_debit_notification
                - title: 'Success: Notification sent successfully (Async Flow)'
                  type: object
                  properties:
                    decentro_txn_id:
                      type: string
                      example: 4F3B119BF3E2493B8D8422E97AB5B977
                    api_status:
                      type: string
                      example: SUCCESS
                    message:
                      type: string
                      example: Successfully initiated the pre-debit notification.
                    data:
                      type: object
                      properties:
                        notification_detail:
                          type: object
                          properties:
                            notification_status:
                              type: string
                              example: PENDING
                    response_key:
                      type: string
                      example: success_pre_debit_notification_initiated

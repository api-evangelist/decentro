                      presentation_status_description:
                        type: string
                        example: Mandate presentation is successful
                  response_key:
                    type: string
                    example: success_execution_gts
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Validation Error:
                  value: "{\n    \"decentro_txn_id\": \"04984XXXXX26FA2F51D2C7E\",\n    \"api_status\": \"FAILURE\",\n    \"message\": \"Please provide the valid Decentro Transaction ID. Hint: decentro_txn_id(string)\",\n    \"response_key\": \"error_invalid_decentro_txn_id\"\n}"
              schema:
                type: object
                properties:
                  decentro_txn_id:
                    type: string
                    example: 04984XXXXX26FA2F51D2C7E

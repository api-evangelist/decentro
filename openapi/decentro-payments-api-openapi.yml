        content:
          application/json:
            schema:
              type: object
              required:
              - reference_id
              - original_transaction_id
              - purpose_message
              properties:
                reference_id:
                  type: string
                  description: A unique ID assigned by clients for every API request.
                original_transaction_id:
                  type: string
                  description: decentro_txn_id shared during original transaction.
                original_attempt_transaction_id:
                  type: string
                  description: attempt_decentro_txn_id shared during original transaction.
                original_reference_id:
                  type: string
                  description: reference_id passed during original transaction.
                bank_reference_number:
                  type: string
                  description: bank_reference_number of the original transaction.
                purpose_message:
                  type: string
                  description: Purpose of the refund.
                amount:
                  type: string

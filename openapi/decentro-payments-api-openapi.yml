                    response_key:
                      type: string
                      example: success_validation_link_created
        '400':
          description: '400'
          content:
            application/json:
              examples:
                'Failure: Both generate_psp_uri or generate_qr passed as true':
                  value: "{\n    \"decentro_txn_id\": \"62C7402E1E2E401DBFFB69BA093C6388\",\n    \"api_status\": \"FAILURE\",\n    \"response_code\": \"E00009\",\n    \"message\": \"Only one of generate_psp_uri or generate_qr can be true for request\",\n    \"response_key\": \"error_output_type_conflict\"\n}"
                'Failure: Invalid Redirect URL (HTTP)':
                  value: "{\n    \"decentro_txn_id\": \"88605D85C7854E7CAD3CC56627C8154D\",\n    \"api_status\": \"FAILURE\",\n    \"message\": \"Redirect URL is invalid. Kindly try again with a correct URL.\",\n    \"response_key\": \"error_invalid_redirect_url\"\n}"
              schema:
                oneOf:
                - title: 'Failure: Both generate_psp_uri or generate_qr passed as true'

  /v3/payments/enach/mandate:
    post:
      summary: Enach Mandate Registration
      description: This API allows the platform to initiate a mandate registration using Decentro's ENACH V3 stack.
      operationId: enach-v3-mandate-registration
      parameters:
      - name: client_id
        in: header
        required: true
        schema:
          type: string
      - name: client_secret
        in: header
        required: true
        schema:
          type: string
      - name: x_on_behalf_of
        in: header
        description: Optional header that allows parent merchant to consume the API on behalf of sub-merchant.
        schema:
          type: string
          default: '{{sub_merchant_consumer_urn}}'
      - name: authorization
        in: header
        description: Customers can generate JWT using our Auth API with various grant types in the request body. JWT is valid for 15minutes.
        schema:
          type: string
          default: Bearer {{JWT}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reference_id
              - consumer_urn
              - start_date
              - end_date
              - amount
              - amount_rule
              - category_code
              - frequency
              properties:
                reference_id:
                  type: string
                  description: A specific unique ID assigned by the platform for the API hit.
                  default: '1234'
                consumer_urn:
                  type: string
                  description: Unique ID assigned to the consumer.
                  default: '12345'
                user:
                  type: object
                  description: Consumer Details block that contains the actual details of the payer. If uistream is set as false, then this mandatory param.
                  properties:
                    name:
                      type: string
                      description: Account holder name
                      default: John Doe
                    account_number:
                      type: string
                      description: User account number
                      default: '98765438761'
                    account_type:
                      type: string
                      description: Type of user account
                      default: Savings
                    reference_number:
                      type: string
                      description: Mandate reference number
                      default: Test_mandate
                    bank_code:
                      type: string
                      description: User account holding bank id
                      default: HDFC
                    mobile:
                      type: string
                      description: Mobile Number of the user
                      default: '9999999999'
                    email:
                      type: string
                      description: Email address of the user
                      default: some_email@mail.com
                start_date:
                  type: string
                  description: Mandate start date
                  default: '2025-01-01'
                  format: date
                end_date:
                  type: string
                  description: Mandate end date
                  default: '2030-01-01'
                  format: date
                amount:
                  type: number
                  description: 'Mandate Amount. Maximum : 1 CR (1,00,00,000)'
                  default: 200
                  format: float
                amount_rule:
                  type: string
                  description: Rule of Amount (FIXED or MAX)
                  default: max
                category_code:
                  type: string
                  description: Category Code as mentioned in the Category Code section
                  default: Sub
                frequency:
                  type: string
                  description: Frequency of the Mandate. Fixed (one-time, adhoc, intra-day, daily, weekly, monthly, quaterly, semi-annually, yearly, bi-monthly)
                  default: Adhoc
                redirection_url:
                  type: string
                  description: URL accepts both web url & deeplinks
                  default: https://www.decentro.tech
                authentication_mode:
                  type: string
                  description: Type of authentication to register the mandate. Should be passed only if "uistreams" flag is set as false. Accepted values are aadhaar, netbanking, pan, customerid & debitcard.
                  default: Debitcard
                uistream:
                  type: string
                  description: To enable the UI based solution, pass the value as true.
            examples:
              Success - Direct Link:
                value:
                  reference_id: XXXX
                  consumer_urn: 5E3XXXXXXXXX992
                  user:
                    name: somefirst somelast
                    account_number: '1234567890'
                    account_type: SAVINGS
                    reference_number: decentro-mandate
                    bank_id: HDFC
                    email: some_email@mail.com
                    mobile: '9999999999'
                    pan: ABCDE1234F
                  start_date: '2024-08-30'
                  end_date: '2030-07-30'
                  amount: 200
                  amount_rule: fixed
                  category_code: elec
                  frequency: weekly
                  redirection_url: https://www.decentro.tech
                  authentication_mode: DebitCard
              'Failure: Invalid Account Number':

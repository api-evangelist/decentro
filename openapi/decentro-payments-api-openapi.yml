  /v3/payments/enach/mandate/status:
    get:
      summary: Enach Mandate Registration Status
      description: This API allows the platform to check the status of a mandate registration using Decentro's ENACH V3 stack.
      operationId: enach-v3-mandate-registration-status
      parameters:
      - name: client_id
        in: header
        required: true
        schema:
          type: string
      - name: client_secret
        in: header
        required: true
        schema:
          type: string
      - name: decentro_txn_id
        in: query
        description: decentroTxnId passed by Decentro in the registration API
        required: true
        schema:
          type: string
      - name: decentro_mandate_id
        in: query
        description: decentro mandate ID as received in successful Mandate Status Response
        schema:
          type: string
      - name: authorization
        in: header
        description: Customers can generate JWT using our Auth API with various grant types in the request body. JWT is valid for 15minutes.
        schema:
          type: string
          default: Bearer {{JWT}}
      responses:
        '200':
          description: '200'
          content:
            application/json:

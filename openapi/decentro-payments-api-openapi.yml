  /v3/payments/upi/link:
    post:
      summary: Generate Payment Link
      description: This API allows the platform to create a payment link/intent flow using Decentro's UPI stack.
      operationId: payments_api-collectionsv3-paymentlink
      parameters:
      - name: client_id
        in: header
        description: Decentro assigned client_id during on boarding.
        required: true
        schema:
          type: string
      - name: client_secret
        in: header
        description: Decentro assigned client_secret during on boarding.
        required: true
        schema:
          type: string
      - name: x_on_behalf_of
        in: header
        description: This allows parent merchant to consume the API on behalf of sub-merchant.
        schema:
          type: string
          default: '{{sub_merchant_consumer_urn}}'
      - name: authorization
        in: header
        description: Customers can generate JWT using our Auth API with various grant types in the request body. JWT is valid for 15minutes.
        schema:
          type: string
          default: Bearer {{JWT}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reference_id
              - consumer_urn
              - amount
              - purpose_message
              - expiry_time
              properties:
                reference_id:
                  type: string
                  description: A unique ID assigned by clients for every API request.
                consumer_urn:
                  type: string
                  description: A unique identifier assigned to client's by Decentro during On boarding.
                amount:
                  type: integer
                  description: The transaction amount you want to collect. Min =  5.00 and MAX = 100000.00. The limits on the amount can be changed depending on merchant use case. Please contact support@decentro.tech for further assistance.
                  format: int32
                purpose_message:
                  type: string
                  description: 'The narration that you want to show as a message for the transfer. (Note: Purpose message must be less than 50 characters).'
                  default: Payment
                generate_psp_uri:
                  type: boolean
                  description: true/false depending on the choice to generate UPI data URI to implement customized flow based on URI data.
                  default: false
                expiry_time:
                  type: integer
                  description: Time parameter in minutes after which the link will get expired. Max value = 1440 minutes (1 day)).
                  format: int32
                redirect_url:
                  type: string
                  description: The custom URL where the user will be redirected after the payment session. Only "https://" endpoints will be accepted.
                account_number:
                  type: string
                  description: Used for TPV. The number of the source bank account from which the payment must be made. Payments from any other account (mapped to the UPI ID) will be rejected.
                account_ifsc:
                  type: string
                  description: Used for TPV. The IFSC number of the source bank account from which the payment must be made. Payments from any other account (mapped to the UPI ID) will be rejected.
                split_settlement_rule_urn:
                  type: string
                  description: This param will help us to identify the split settlement rule at transaction level.
            examples:
              SUCCESS:
                value:
                  reference_id: 0000-0000-0001
                  consumer_urn: 84E9A23xxxxxxxxxxxxxxx9E5FE16A
                  amount: 100
                  purpose_message: test
                  expiry_time: 30
                  redirect_url: https://www.google.com
                  generate_psp_uri: false
                  split_settlement_rule_urn: XXXXXX
                  payer_details:
                  - account_number: '98787686868686'
                    account_ifsc: ICIC0003464
              SUCCESS With Deeplinks:
                value:
                  reference_id: 0000-0000-0001
                  consumer_urn: 84E9A23xxxxxxxxxxxxxxx9E5FE16A
                  amount: 100
                  purpose_message: test
                  expiry_time: 30
                  redirect_url: https://www.google.com
                  generate_psp_uri: true
                  payer_details:
                  - account_number: '98787686868686'
                    account_ifsc: ICIC0003464
              Request Example:
                value:
                  reference_id: 0000-0000-0002
                  consumer_urn: <invalid consumer urn>
                  amount: 100
                  purpose_message: test
                  expiry_time: 30
                  generate_psp_uri: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                SUCCESS:
                  value: "{\n    \"decentro_txn_id\": \"C674C2A49Dxxxxxxxxxxxx52AEF9\",\n    \"api_status\": \"SUCCESS\",\n    \"message\": \"Payment Link created Successfully.\",\n    \"data\": {\n        \"upi_uris\": {\n            \"common_uri\": \"<UPI payment link>\"\n        },\n        \"transaction_status\": \"PENDING\"\n    },\n    \"response_key\": \"success_payment_link_created\"\n}"
                'SUCCESS: With URI deeplink':
                  value: "{\n    \"decentro_txn_id\": \"49E0BD1DD9FF4B77A0B97868C62E4AC8\",\n    \"api_status\": \"SUCCESS\",\n    \"message\": \"Payment Link created Successfully.\",\n    \"data\": {\n        \"upi_uris\": {\n            \"common_uri\": \"<UPI payment link>\",\n            \"gpay_uri\": \"<UPI payment link for Gpay>\",\n            \"phonepe_uri\": \"<UPI payment link for Phonepe>\",\n            \"paytm_uri\": \"<UPI payment link for paytm>\",\n            \"cred_uri\": \"<UPI payment link for cred>\"\n        },\n        \"transaction_status\": \"PENDING\"\n    },\n    \"response_key\": \"success_payment_link_created\"\n}"
              schema:
                oneOf:
                - title: SUCCESS
                  type: object
                  properties:
                    decentro_txn_id:
                      type: string
                      example: C674C2A49Dxxxxxxxxxxxx52AEF9
                    api_status:
                      type: string
                      example: SUCCESS
                    message:
                      type: string

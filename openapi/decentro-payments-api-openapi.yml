  /v3/payments/rpd/intent:
    post:
      summary: Reverse Penny Drop/Penny Pull - Intent API
      description: This API allows the platform to create an Intent link using Decentro's Penny pull stack.
      operationId: penny-pull-intent-api-pa
      parameters:
      - name: client_id
        in: header
        description: Decentro assigned client_id during on boarding.
        required: true
        schema:
          type: string
      - name: client_secret
        in: header
        description: Decentro assigned client_secret during on boarding.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reference_id
              - consumer_urn
              properties:
                reference_id:
                  type: string
                  description: Unique id assigned to each transaction. Special characters are prohibited.
                consumer_urn:
                  type: string
                  description: A unique identifier assigned to client's by Decentro during On boarding.
                expiry_time:
                  type: integer
                  description: Time parameter in minutes after which the link will expire. Min Value = 1 minute. Max Value = 60 minutes..
                  default: 60
                  format: int32
                generate_qr:
                  type: boolean
                  description: If this value is passed, decfin will generate a QR code instead of an intent link. Possible Values = 'true' or 'false'. Defaults to false.
                  default: false
                generate_psp_uri:
                  type: boolean
                  description: If this value is passed, decfin will respond with psp specific deeplinks  Possible Values = 'true' or 'false'. Defaults to false.
                  default: false
                redirect_url:
                  type: string
                  description: The custom URL where the user will be redirected after the payment session ends. Only "https://" endpoints will be accepted.
            examples:
              'Success: Basic Validation Link':
                value:
                  reference_id: 0000-0000-0001
                  consumer_urn: 84E9A23xxxxxxxxxxxxxxx9E5FE16A
                  expiry_time: 60
                  generate_qr: false
                  generate_psp_uri: false
                  redirect_url: https://gmail.com
              'Success: With UPI QR Code':
                value:
                  reference_id: 0000-0000-0001
                  consumer_urn: 84E9A23xxxxxxxxxxxxxxx9E5FE16A
                  expiry_time: 60
                  generate_qr: true
                  generate_psp_uri: false
                  redirect_url: https://gmail.com
              'Success: With UPI Deep Links':
                value:
                  reference_id: 0000-0000-0001
                  consumer_urn: 84E9A23xxxxxxxxxxxxxxx9E5FE16A
                  expiry_time: 60
                  generate_qr: false
                  generate_psp_uri: true
                  redirect_url: https://gmail.com
              'Failure: Invalid Generate QR value':
                value:
                  reference_id: 0000-0000-0001
                  consumer_urn: 84E9A23xxxxxxxxxxxxxxx9E5FE16A
                  expiry_time: 60
                  generate_qr: 'FALSE'
                  generate_psp_uri: false
                  redirect_url: https://gmail.com
              'Failure: Invalid Generate PSP URI value':
                value:
                  reference_id: 0000-0000-0001
                  consumer_urn: 84E9A23xxxxxxxxxxxxxxx9E5FE16A
                  expiry_time: 60
                  generate_qr: false
                  generate_psp_uri: 'False'
                  redirect_url: https://gmail.com
              'Failure: Both generate_psp_uri or generate_qr passed as true':
                value:
                  reference_id: 0000-0000-0001
                  consumer_urn: 84E9A23xxxxxxxxxxxxxxx9E5FE16A
                  expiry_time: 60
                  generate_qr: true
                  generate_psp_uri: true
                  redirect_url: https://gmail.com
              'Failure: Invalid Redirect URL (HTTP)':
                value:
                  reference_id: 0000-0000-0001
                  consumer_urn: 84E9A23xxxxxxxxxxxxxxx9E5FE16A
                  expiry_time: 60
                  generate_qr: true
                  generate_psp_uri: true
                  redirect_url: http://gmail.com
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Success:
                  value: "{\n    \"decentro_txn_id\": \"78C85EDB672A4187B99431CA85EFC604\",\n    \"api_status\": \"SUCCESS\",\n    \"response_code\": \"S00000\",\n    \"message\": \"Validation Link created Successfully.\",\n    \"data\": {\n        \"validation_link\": \"<validation_short_link>\"\n    },\n    \"response_key\": \"success_validation_link_created\"\n}"
                'Success: With UPI QR Code':
                  value: "{\n    \"decentro_txn_id\": \"78C85EDB672A4187B99431CA85EFC604\",\n    \"api_status\": \"SUCCESS\",\n    \"response_code\": \"S00000\",\n    \"message\": \"Validation Link created Successfully.\",\n    \"data\": {\n        \"validation_link\": \"<validation_short_link>\"\n    },\n    \"response_key\": \"success_validation_link_created\"\n}"
                'Success: With UPI Deep Linking URI':
                  value: "{\n    \"decentro_txn_id\": \"34B1E3E2EE9C46E696FC80C472E2058E\",\n    \"api_status\": \"SUCCESS\",\n    \"response_code\": \"S00000\",\n    \"message\": \"Validation Link created Successfully.\",\n    \"data\": {\n        \"validation_link\": \"<validation_short_link>\",\n        \"gpay_uri\": \"<validation_short_link_for_GPay>\",\n        \"phonepe_uri\": \"<validation_short_link_for_PhonePe>\",\n        \"paytm_uri\": \"<validation_short_link_for_PayTM>\"\n    },\n    \"response_key\": \"success_validation_link_created\"\n}"
              schema:
                oneOf:
                - title: Success
                  type: object
                  properties:
                    decentro_txn_id:
                      type: string
                      example: 78C85EDB672A4187B99431CA85EFC604
                    api_status:
                      type: string
                      example: SUCCESS
                    response_code:
                      type: string
                      example: S00000
                    message:
                      type: string
                      example: Validation Link created Successfully.
                    data:
                      type: object
                      properties:
                        validation_link:
                          type: string
                          example: <validation_short_link>
                    response_key:
                      type: string
                      example: success_validation_link_created
                - title: 'Success: With UPI QR Code'
                  type: object
                  properties:
                    decentro_txn_id:
                      type: string
                      example: 78C85EDB672A4187B99431CA85EFC604
                    api_status:
                      type: string
                      example: SUCCESS
                    response_code:
                      type: string
                      example: S00000
                    message:
                      type: string
                      example: Validation Link created Successfully.
                    data:
                      type: object
                      properties:
                        validation_link:
                          type: string
                          example: <validation_short_link>
                    response_key:
                      type: string
                      example: success_validation_link_created
                - title: 'Success: With UPI Deep Linking URI'
                  type: object
                  properties:
                    decentro_txn_id:
                      type: string
                      example: 34B1E3E2EE9C46E696FC80C472E2058E
                    api_status:
                      type: string
                      example: SUCCESS
                    response_code:
                      type: string
                      example: S00000
                    message:
                      type: string

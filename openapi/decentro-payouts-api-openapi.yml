openapi: 3.2.0
info:
  title: Decentro Payments Payouts API
  description: Decentro's Payments API supports collections (UPI, dynamic QR), payouts, ENACH mandates, UPI Autopay, settlements, and refunds in the Indian banking system.
  version: '1.0'
  contact:
    name: Decentro
    url: https://decentro.tech/
servers:
- url: https://in.decentro.tech
  description: India production
security:
- apiKey: []
tags:
- name: Payouts
paths:
  /v2/payments/transfer:
    post:
      summary: Disburse a payout
      operationId: createPayout
      tags:
      - Payouts
      responses:
        '200':
          description: Payout submitted.
  /v2/payments/transfer/status:
    get:
      summary: Get payout status
      operationId: getPayoutStatus
      tags:
      - Payouts
      responses:
        '200':
          description: Current status of a payout.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: client_secret

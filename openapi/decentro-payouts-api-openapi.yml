openapi: 3.1.0
info:
  title: Decentro KYC & Onboarding Accounts Payouts API
  description: Decentro's KYC & Onboarding API provides identity verification, customer onboarding workflows, and document/face forensics for Indian financial services.
  version: '1.0'
  contact:
    name: Decentro
    url: https://decentro.tech/
servers:
- url: https://in.decentro.tech
  description: India production
- url: https://staging.decentro.tech
  description: Staging
security:
- apiKey: []
tags:
- name: Payouts
paths:
  /v2/payments/transfer:
    post:
      summary: Disburse a payout
      operationId: createPayout
      tags:
      - Payouts
      responses:
        '200':
          description: Payout submitted.
  /v2/payments/transfer/status:
    get:
      summary: Get payout status
      operationId: getPayoutStatus
      tags:
      - Payouts
      responses:
        '200':
          description: Current status of a payout.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: client_secret

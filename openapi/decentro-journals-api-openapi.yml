openapi: 3.2.0
info:
  title: Decentro Ledger Journals API
  description: Decentro Ledger API provides double-entry accounting primitives - journals, ledger accounts, and transactions - to record financial activity across virtual accounts and external counterparties.
  version: '1.0'
servers:
- url: https://in.decentro.tech
  description: India production
security:
- apiKey: []
tags:
- name: Journals
paths:
  /v2/ledger/journal:
    post:
      summary: Create a journal entry
      operationId: createJournalEntry
      tags:
      - Journals
      responses:
        '200':
          description: Journal entry recorded.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: client_secret

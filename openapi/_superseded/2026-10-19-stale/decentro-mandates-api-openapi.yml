openapi: 3.2.0
info:
  title: Decentro Payments Mandates API
  description: Decentro's Payments API supports collections (UPI, dynamic QR), payouts, ENACH mandates, UPI Autopay, settlements, and refunds in the Indian banking system.
  version: '1.0'
  contact:
    name: Decentro
    url: https://decentro.tech/
servers:
- url: https://in.decentro.tech
  description: India production
security:
- apiKey: []
tags:
- name: Mandates
paths:
  /v2/payments/enach/register:
    post:
      summary: Register an ENACH mandate
      operationId: registerEnachMandate
      tags:
      - Mandates
      responses:
        '200':
          description: Mandate registration result.
  /v2/payments/upi-autopay/mandate:
    post:
      summary: Register a UPI Autopay mandate
      operationId: registerUpiAutopayMandate
      tags:
      - Mandates
      responses:
        '200':
          description: Autopay mandate registration.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: client_secret

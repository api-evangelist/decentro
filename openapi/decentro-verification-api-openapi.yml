openapi: 3.1.0
info:
  title: Decentro KYC & Onboarding Accounts Verification API
  description: Decentro's KYC & Onboarding API provides identity verification, customer onboarding workflows, and document/face forensics for Indian financial services.
  version: '1.0'
  contact:
    name: Decentro
    url: https://decentro.tech/
servers:
- url: https://in.decentro.tech
  description: India production
- url: https://staging.decentro.tech
  description: Staging
security:
- apiKey: []
tags:
- name: Verification
paths:
  /v2/kyc/public_registry/validate:
    post:
      summary: Validate against public registry
      operationId: validatePublicRegistry
      tags:
      - Verification
      responses:
        '200':
          description: Validation result.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: client_secret

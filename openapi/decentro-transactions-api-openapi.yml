openapi: 3.2.0
info:
  title: Decentro Ledger Transactions API
  description: Decentro Ledger API provides double-entry accounting primitives - journals, ledger accounts, and transactions - to record financial activity across virtual accounts and external counterparties.
  version: '1.0'
servers:
- url: https://in.decentro.tech
  description: India production
security:
- apiKey: []
tags:
- name: Transactions
paths:
  /v2/ledger/transactions:
    get:
      summary: List transactions
      operationId: listLedgerTransactions
      tags:
      - Transactions
      responses:
        '200':
          description: Transactions in the ledger.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: client_secret

openapi: 3.2.0
info:
  title: Decentro Payments Collections API
  description: Decentro's Payments API supports collections (UPI, dynamic QR), payouts, ENACH mandates, UPI Autopay, settlements, and refunds in the Indian banking system.
  version: '1.0'
  contact:
    name: Decentro
    url: https://decentro.tech/
servers:
- url: https://in.decentro.tech
  description: India production
security:
- apiKey: []
tags:
- name: Collections
paths:
  /v2/payments/upi/link:
    post:
      summary: Generate UPI collection link
      operationId: generateUpiLink
      tags:
      - Collections
      responses:
        '200':
          description: UPI link created.
  /v2/payments/upi/qr:
    post:
      summary: Generate dynamic UPI QR
      operationId: generateUpiQr
      tags:
      - Collections
      responses:
        '200':
          description: QR code generated.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: client_secret

openapi: 3.1.0
info:
  title: Decentro KYC & Onboarding Accounts Collections API
  description: Decentro's KYC & Onboarding API provides identity verification, customer onboarding workflows, and document/face forensics for Indian financial services.
  version: '1.0'
  contact:
    name: Decentro
    url: https://decentro.tech/
servers:
- url: https://in.decentro.tech
  description: India production
- url: https://staging.decentro.tech
  description: Staging
security:
- apiKey: []
tags:
- name: Collections
paths:
  /v2/payments/upi/link:
    post:
      summary: Generate UPI collection link
      operationId: generateUpiLink
      tags:
      - Collections
      responses:
        '200':
          description: UPI link created.
  /v2/payments/upi/qr:
    post:
      summary: Generate dynamic UPI QR
      operationId: generateUpiQr
      tags:
      - Collections
      responses:
        '200':
          description: QR code generated.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: client_secret

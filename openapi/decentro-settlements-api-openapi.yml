openapi: 3.2.0
info:
  title: Decentro Payments Settlements API
  description: Decentro's Payments API supports collections (UPI, dynamic QR), payouts, ENACH mandates, UPI Autopay, settlements, and refunds in the Indian banking system.
  version: '1.0'
  contact:
    name: Decentro
    url: https://decentro.tech/
servers:
- url: https://in.decentro.tech
  description: India production
security:
- apiKey: []
tags:
- name: Settlements
paths:
  /v2/payments/refund:
    post:
      summary: Issue a refund
      operationId: issueRefund
      tags:
      - Settlements
      responses:
        '200':
          description: Refund initiated.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: client_secret
